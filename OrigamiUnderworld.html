  /* SECURITY — same-origin postMessage gate (Mark 2026-06-14). Every game frame (shell/engine/ [REF#MG-00002]
     panels) loads the others from RELATIVE src = same origin, so every LEGIT cross-frame message
     shares location.origin. This capture-phase guard registers FIRST and drops any message from a
     foreign origin before it reaches ANY handler in this frame — closing the injection surface for
     the ~170-type wire protocol (grant-gold / save-corrupt / action-spoof) from a malicious
     embedder or extension. Empty origin (file://) allowed for local play. Disable: window.__msgGateOff=true. */
  (function(){var T=[/* production allowlist: www + apex of origamiunderworld.com */'https://www.origamiunderworld.com','https://origamiunderworld.com'];try{window.addEventListener('message',function(e){var o=e.origin;if(o!==''&&o!==location.origin&&T.indexOf(o)<0&&!window.__msgGateOff){e.stopImmediatePropagation();}},true);}catch(_){}})();
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
    #fpv-viewport{position:absolute;inset:0;z-index:0}
    #fpv-viewport iframe{width:100%;height:100%;border:none}
    #ui-viewport{position:absolute;inset:0;z-index:30;pointer-events:none;background:transparent}
    #ui-viewport iframe{width:100%;height:100%;border:none;background:transparent;pointer-events:auto}
    #v8-badge{position:fixed;top:6px;left:10px;z-index:50;pointer-events:none;font:10px monospace;color:rgba(200,169,110,.5);letter-spacing:1.5px}
    /* Bottom-left git version badge — populated by gitVersion.js at boot. [REF#MG-00006]
       Lives in the shell at z:50 so it sits ABOVE the panels iframe (z:30)
       and the engine canvas (z:0), and to the LEFT of the thumb panel UI. */
    /* NO BUILD BADGE ON PHONES (Mark 2026-09-19: "remove build number off of mobile"). Desktop keeps it — it is the [REF#MG-00245]
       stale-site check the playbook relies on. [REF#PENDING] */
    @media (max-width:750px), ((pointer:coarse) and (hover:none) and (max-width:1200px)) { #git-version-badge{display:none !important} }
    #git-version-badge{position:fixed;bottom:6px;left:10px;z-index:50;pointer-events:auto;cursor:pointer;font:10px monospace;color:rgba(200,169,110,.45);letter-spacing:1px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
    #git-version-badge:hover{color:rgba(200,169,110,.85)}
    #git-version-badge .gv-sha{color:rgba(255,215,0,.6);font-weight:700}
    #git-version-badge .gv-branch{color:rgba(150,200,255,.4);margin-right:6px}
    #git-version-badge .gv-built{color:rgba(200,169,110,.7)}
    #git-version-badge .gv-copy{opacity:.5;margin-right:6px}
    #git-version-badge:hover .gv-copy{opacity:1}
    /* Descent fade — covers the engine iframe during floor reload [REF#MG-00007] */
    #descent-fade{position:fixed;inset:0;z-index:9999;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease;display:flex;align-items:center;justify-content:center;color:rgba(200,169,110,.8);font:600 14px monospace;letter-spacing:3px}
    #descent-fade.active{opacity:1;pointer-events:auto}
    /* Real % progression bar on floor transition (Mark 2026-07-13 "dungeon generation should be done during progression loading bar") [REF#MG-00008] */
    #descent-fade{background:radial-gradient(ellipse at 50% 42%,#0d0b09 0%,#050404 55%,#000 100%)}
    #descent-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:13px;width:min(460px,64vw)}
    #descent-title{font:600 14px monospace;letter-spacing:3px;color:rgba(200,169,110,.85);text-shadow:0 0 18px rgba(200,169,110,.28)}
    /* 奈落 "the abyss" — a huge, slowly breathing watermark behind the bar. Pure compositor work, no GPU pipeline cost. [REF#MG-00009] */
    #descent-kanji{position:absolute;z-index:1;font:700 clamp(120px,26vh,240px)/1 "Hiragino Mincho ProN","Yu Mincho",serif;color:rgba(200,169,110,.055);letter-spacing:.12em;pointer-events:none;-webkit-user-select:none;user-select:none;animation:descent-breathe 7s ease-in-out infinite}
    @keyframes descent-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
    /* Floor readout — the one number that says where you're going. [REF#MG-00010] */
    #descent-floor{display:flex;align-items:baseline;gap:9px;margin-top:-4px}
    #descent-floor-num{font:700 40px/1 monospace;color:rgba(224,192,132,.92);text-shadow:0 0 26px rgba(200,169,110,.45);font-variant-numeric:tabular-nums}
    #descent-floor-lbl{font:600 9px monospace;letter-spacing:4px;color:rgba(200,169,110,.42)}
    #descent-bar{position:relative;width:100%;height:9px;background:rgba(200,169,110,.10);border:1px solid rgba(200,169,110,.18);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.65)}
    /* NO width transition: the easing rAF in the relay owns the motion now, and a CSS transition on top of it [REF#MG-00011]
       double-smooths into visible lag. The fill is written every frame instead. */
    #descent-bar-fill{position:relative;height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,rgba(150,120,70,.75),rgba(224,192,132,.98) 70%,rgba(255,236,190,1));box-shadow:0 0 14px rgba(224,192,132,.5)}
    /* Shimmer sweep — reads as "still working" even while a chunk of the build blocks between progress posts. [REF#MG-00012] */
    #descent-bar-shine{position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);transform:translateX(-100%);animation:descent-shine 1.5s ease-in-out infinite}
    @keyframes descent-shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
    /* Depth ticks — 10 faint marks so the fill reads as a descent down a shaft, not an abstract percentage. [REF#MG-00013] */
    #descent-bar-ticks{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px),rgba(0,0,0,.5) 10%)}
    #descent-pct{font:600 12px monospace;letter-spacing:2px;color:rgba(200,169,110,.75);font-variant-numeric:tabular-nums}
    #descent-status{font:500 10px monospace;letter-spacing:1px;color:rgba(200,169,110,.42);min-height:12px;text-transform:uppercase;transition:opacity .25s ease}
    @media (prefers-reduced-motion:reduce){#descent-kanji,#descent-bar-shine{animation:none}}
    /* ── Atmospheric "spooky grade" overlay (2026-06-09, Mark: "max css, so much shadow, spooky") ── [REF#MG-00014]
       FREE compositor-layer cinematic grade over the 3D view: cold-dark vignette + film grain +
       slow "breath". ZERO 3D/GPU-pipeline cost, works in EVERY view (incl. top-down, which bypasses
       the composer). pointer-events:none → clicks pass straight through to the engine (never break
       click-forwarding). z:10 = above the engine canvas (z:0), BELOW the UI panels (z:30) so cards/
       buttons stay crisp & un-graded. Live-tune from the console (no reload):
         const g=document.getElementById('fx-grade');
         g.style.setProperty('--vig','0.72');    // edge darkness   0..1
         g.style.setProperty('--grade','0.45');   // cold-shadow tint 0..1
         g.style.setProperty('--grain','0.09');   // film grain       0..1
         g.classList.toggle('off');                // kill the grade entirely */
    #fx-grade{display:none; /* DISABLED 2026-06-12 (Mark: "that green issue is back… happens when the lights go down") — this green-teal grade (rgba(8,26,30)/rgba(4,12,17)) becomes the dominant tint whenever the 3D scene dims (succubus show, dark rooms). Restore: delete this display:none. */
      position:fixed;inset:0;z-index:10;pointer-events:none;will-change:opacity;
      --vig:0.78;--grade:0.5;--grain:0.078;
      background:
        radial-gradient(ellipse 84% 88% at 50% 45%, rgba(8,26,30,0) 30%, rgba(4,12,17,var(--grade)) 100%),
        radial-gradient(ellipse 74% 80% at 50% 45%, rgba(0,0,0,0) 38%, rgba(0,0,0,var(--vig)) 100%),
        linear-gradient(180deg, rgba(0,4,7,0.34) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 78%, rgba(0,3,6,0.40) 100%);
      animation:fxBreath 8s ease-in-out infinite;}
    #fx-grade.off{display:none}
    #fx-grade::after{content:'';position:absolute;inset:-60%;pointer-events:none;will-change:transform;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.55'/></svg>");
      opacity:var(--grain);mix-blend-mode:overlay;animation:fxGrain .7s steps(3) infinite;}
    @keyframes fxBreath{0%,100%{opacity:1}50%{opacity:.94}}
    @keyframes fxGrain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
    /* ── THE PARIS DREAM ───────────────────────────────────────────────────────────────────────── [REF#MG-00015]
       95% transparent, per Mark. The whole thing is ONE composited layer: no repaint work per frame,
       only transform+opacity, which is the pair browsers hand straight to the compositor.
       will-change is deliberately NOT set — it forces a permanent layer even while hidden, and this is
       a rare one-off. The .on class is what promotes it, for as long as the song runs. */
    #dream-overlay{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
      transition:opacity 2.8s ease;   /* a dream arrives slowly */
      perspective:1400px;perspective-origin:50% 42%;
      mix-blend-mode:screen}          /* light ADDS — it reads as a projection, not a decal */
    #dream-overlay.on{opacity:1}
    /* THE MOON — pure radial gradients. No texture, no image request, crisp at any resolution [REF#MG-00016]
       (Mark asked for "high4k res": a gradient is resolution-independent, which beats a 4K bitmap). */
    #dream-moon{position:absolute;left:68%;top:12%;width:min(22vw,260px);aspect-ratio:1;border-radius:50%;
      background:
        radial-gradient(circle at 38% 34%, rgba(255,252,240,0.95) 0%, rgba(246,240,214,0.85) 42%, rgba(214,206,178,0.55) 72%, rgba(180,172,150,0.18) 88%, rgba(0,0,0,0) 100%),
        radial-gradient(circle at 62% 66%, rgba(120,116,104,0.30) 0%, rgba(0,0,0,0) 55%);
      box-shadow:0 0 90px 30px rgba(226,232,255,0.16), 0 0 200px 90px rgba(150,180,255,0.10);
      animation:dreamMoon 34s ease-in-out infinite alternate}
    @keyframes dreamMoon{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.03)}}
    /* THE TOWER — slow turn on its own axis, the "rotates under a moonlit night". 3D transform only. [REF#MG-00017] */
    #dream-stage{position:absolute;left:50%;top:50%;width:min(38vw,520px);height:min(74vh,760px);
      transform-style:preserve-3d;translate:-50% -50%;
      animation:dreamSpin 48s linear infinite}
    #dream-stage svg{width:100%;height:100%;overflow:visible;
      filter:drop-shadow(0 0 26px rgba(190,214,255,0.45)) drop-shadow(0 0 70px rgba(120,160,255,0.22))}
    @keyframes dreamSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
    /* A banished demon dreaming of being mortal — the light should waver, not sit still. [REF#MG-00018] */
    #dream-overlay.on #dream-stage svg{animation:dreamBreathe 9s ease-in-out infinite}
    @keyframes dreamBreathe{0%,100%{opacity:.85}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      #dream-stage,#dream-moon,#dream-overlay.on #dream-stage svg{animation:none}
    }

    /* Her SONG chat bubble — DEDICATED, song text ONLY (driven by SUC_SONG; NOT the Oni-Baba event log). Mark: [REF#MG-00019]
       "new text chat bubbles to show her song text". Near the top, kanji over English, with a speech tail. */
    #chat-overlay{position:fixed;right:170px;top:12%;transform:translateY(-8px);z-index:55;pointer-events:none;
      width:300px;max-width:calc(100vw - 340px);box-sizing:border-box;overflow-wrap:anywhere;text-align:left;opacity:0;transition:opacity .35s ease, transform .35s ease;
      font-family:'Noto Sans JP','Hiragino Kaku Gothic Pro',system-ui,sans-serif;
      color:#eaf7ff;font-size:16px;font-weight:600;line-height:1.35;
      padding:12px 16px;border-radius:8px;
      /* ── WCAG 2.2 AAA (Mark 2026-07-31: "wcag 2.2/aaa compliance") ──────────────────────────── [REF#MG-00020]
         The background used to be 0.74 alpha, which meant the caption's contrast was NOT A PROPERTY
         OF THE CAPTION — it depended on whatever the 3D scene was drawing behind it. Measured worst
         case (the box composited over white, i.e. a lantern or a pale wall behind her) came out at
         6.57:1 for the Japanese line and 4.32:1 for the English: below the 7:1 AAA needs, and there
         was no styling of the TEXT that could fix it while the backdrop stayed variable.
         So the backdrop is now effectively opaque (0.97) and the ratios become deterministic —
         16.8:1 / 14.2:1 / 13.2:1 whatever is behind her. The blur stays, so it still reads as glass.
         Measured by scripts/probe-caption-a11y.js, which composites over WHITE and requires AAA
         against that worst case rather than against the CSS colour. */
      background:linear-gradient(180deg, rgba(13,20,28,0.97), rgba(6,11,16,0.97));
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border:1px solid rgba(120,210,255,0.30);
      box-shadow:0 10px 34px rgba(0,0,0,0.55), 0 0 28px rgba(90,205,255,0.20), inset 0 0 0 1px rgba(255,255,255,0.04);
      text-shadow:0 2px 10px rgba(0,0,0,.9)}
    #chat-overlay.on{opacity:1;transform:translateY(0)}
    @media(max-width:800px){
      #chat-overlay{right:12px;top:72px;width:240px;max-width:calc(100vw - 24px);font-size:14px;padding:10px 12px}
    }

    /* ── 投げ銭 TIP MODAL — NEUMORPHIC, IN THE GUIDEBOOK'S OWN CLOTH (Mark 2026-08-02: "beautiful [REF#MG-00021]
       small nuemorphic window … elegant dark coloring to match our guidebook"). Palette read straight
       from PlayerGuide.js: charcoal page #25282c→#1a1c20, teal accent #22d3ee/#5eead4 (its donate
       button verbatim), gold #e8c66a, slate #94a3b8. Neumorphism on dark = one surface, TWO lights:
       a deep drop to the lower-right, a faint rim-light upper-left; buttons raise, wells sink. */
    #nagesen-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:80;
      width:min(400px,90vw);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
      font-family:'Noto Sans JP','Hiragino Kaku Gothic Pro',system-ui,sans-serif;color:#cdcad1;text-align:center;
      padding:22px 22px 16px;border-radius:26px;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(34,211,238,0.05) 0%, transparent 60%),
        linear-gradient(145deg, #26292e 0%, #1a1c20 100%);
      box-shadow:
        12px 12px 28px rgba(0,0,0,0.65),
        -7px -7px 18px rgba(255,255,255,0.045),
        inset 1px 1px 1px rgba(255,255,255,0.06),
        inset -1px -1px 2px rgba(0,0,0,0.45)}
    #nagesen-modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
    #nagesen-modal .ng-kanji{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-weight:800;
      letter-spacing:.14em;color:#e8c66a;text-shadow:0 1px 0 rgba(0,0,0,.8), 0 0 22px rgba(232,198,106,.18)}
    #nagesen-modal .ng-sub{font-size:10px;letter-spacing:.34em;color:#94a3b8;margin:3px 0 12px}
    #nagesen-modal .ng-song{font-size:13px;color:#a4a8ad;margin-bottom:12px;font-style:italic;font-family:Georgia,serif}
    /* the embed sits in a SUNKEN well — pressed into the surface, the player floating in it [REF#MG-00022] */
    #nagesen-modal .ng-embed:not(:empty){padding:8px;border-radius:16px;margin-bottom:4px;
      background:linear-gradient(145deg,#191b1f,#212428);
      box-shadow:inset 4px 4px 10px rgba(0,0,0,0.55), inset -3px -3px 8px rgba(255,255,255,0.04)}
    #nagesen-modal .ng-btn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:11px 12px;
      border-radius:14px;font:700 14px 'Noto Sans JP',system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;
      border:none;transition:box-shadow .15s ease, transform .15s ease, filter .15s ease}
    #nagesen-modal .ng-btn:active{transform:translateY(1px)}
    /* PayPal — the guidebook's own donate teal, raised off the charcoal [REF#MG-00023] */
    #nagesen-modal .ng-paypal{color:#04222a;background:linear-gradient(180deg,#5eead4,#22d3ee);
      box-shadow:6px 6px 14px rgba(0,0,0,0.55), -4px -4px 10px rgba(255,255,255,0.05), 0 4px 14px rgba(34,211,238,.25)}

  <!-- ── R4 · WCAG 2.4.1 Bypass Blocks + landmark structure (Mark GO 2026-08-14) ────────────────── [REF#MG-00028]
       The shell had no skip link and no landmarks, so a screen-reader user arriving on the page had
       to walk the whole HUD to reach anything. The skip target is the guidebook's WORLD page + its
       command box, because for a keyboard or AT player that pair IS the main content: everything in
       the 3D scene is reachable from there (see plans/WCAG_22_AA_PLAYBOOK.md §7). Visible on focus
       only — it must never cover the dungeon for mouse players. -->
  <a id="a11y-skip" class="a11y-skip" href="#ui-viewport">Skip to the guidebook and command box</a>
  <style>
    .a11y-skip {
      position: fixed; top: -100px; left: 12px; z-index: 2147483647;
      padding: 10px 16px; min-height: 24px;
      background: #0b1a1f; color: #cdeee6; border: 2px solid #22d3ee; border-radius: 10px;
      font: 600 13px/1.2 system-ui, sans-serif; text-decoration: none;
      transition: top 0.12s ease;
    }
    .a11y-skip:focus { top: 12px; outline: 3px solid #22d3ee; outline-offset: 2px; }
  </style>
  <script>
    // Activating the skip link opens the guidebook on its World page and drops focus into the [REF#MG-00029]
    // command input — the same destination F1 reaches. Both legs post OPEN_GUIDE_WORLD so there is
    // exactly one way in (and one thing to keep working).
    document.addEventListener('DOMContentLoaded', () => {
      const sk = document.getElementById('a11y-skip');
      if (!sk) return;
      sk.addEventListener('click', (ev) => {
        ev.preventDefault();
        try {
          const pf = document.getElementById('panels-iframe');
          if (pf && pf.contentWindow) pf.contentWindow.postMessage({ type: 'OPEN_GUIDE_WORLD', focusInput: true }, '*');
        } catch (_) {}
      });
    });
  </script>

  <!-- ════════════════════════════════════════════════════════════════════════════════════════════ [REF#MG-00030]
       CAMERA PAGE FLASH (Mark 2026-08-12: "with camera flash - make the entire page lightup with that
       flash - hyper realistic photo flash fx when camera is clicked to blind")
       LIVES IN THE SHELL ON PURPOSE. The engine and the panels are separate IFRAMES; an overlay inside
       either one is clipped to that frame, so a flash drawn in the engine would light the dungeon while
       the side panels, card rail, chat bar and event log stayed dark. This document is the only surface
       that sits above BOTH frames, so the flash reads as the room being lit, not as a screen effect.
       THREE LAYERS, BECAUSE ONE WHITE RECTANGLE READS AS A GLITCH, NOT A FLASHBULB. A real xenon pop has
       a near-instant rise, a blown-out hot centre, and a short tail that cools as the tube discharges:
         .cf-core  radial hot spot, pure white, blows out first and dies first (the bulb itself)
         .cf-sheet full-frame fill, very slightly COOL (#f7faff ~ xenon 5500-6000K), the room lighting up
         .cf-warm  a faint warm tail that outlives both — the discharge cooling + the eye's afterimage
       OPACITY-ONLY ANIMATION, deliberately. Everything here is GPU-composited. Applying a CSS `filter`
       to the iframes would have been the obvious way to "light up the page" and is exactly what the
       120fps@4K mandate forbids in spirit — it forces a full-page repaint every frame of the animation.
       No filter, no backdrop-filter, no layout property is touched.
       ANTI-STROBE: the camera has a real 10s cooldown (_weaponCdMs.camera), so this cannot repeat-fire.
       prefers-reduced-motion is honoured with a much dimmer, shorter pop rather than a hard off, so the
       gameplay cue (you fired the flash) still lands.
       Off: window._cameraPageFlash = false (engine side, stops the post at the shutter).
       ════════════════════════════════════════════════════════════════════════════════════════════ -->
  <style>
    #camera-page-flash{
      position:fixed; inset:0; z-index:2147483600;   /* above the panels iframe's own 2147483000 log layer */
      pointer-events:none; opacity:0; display:none;
      contain:strict; will-change:opacity;
    }
    /* ⚠⚠ `opacity:1` HERE IS THE WHOLE EFFECT. THE CONTAINER ABOVE IS opacity:0. ⚠⚠ [REF#MG-00031]
       Until 2026-08-12 this rule set `display:block` and NOTHING ELSE, so the container stayed at
       opacity 0 for the entire animation and MULTIPLIED EVERY CHILD TO ZERO. The layers animated
       perfectly to opacity 1 and not one pixel ever reached the screen — the flash had never once
       been visible since the day it was written.
       HOW IT SURVIVED A "FIX": the 2026-08-12 peak-at-0% work below measured the CHILD opacities
       via rAF, saw them reach 1.0, and called it good. Child opacity is not what you see. The only
       honest test is a SCREENSHOT AT PEAK — /tmp/flash-peak.png showed the untouched game at t+40ms.
       If you ever touch this block: verify on PIXELS, never on getComputedStyle of a descendant. */
    #camera-page-flash.cf-fire{ display:block; opacity:1; }
    #camera-page-flash .cf-l{ position:absolute; inset:0; opacity:0; will-change:opacity; }
    #camera-page-flash .cf-sheet{ background:#f7faff; }
    #camera-page-flash .cf-core{
      background:radial-gradient(ellipse 70% 60% at 50% 46%,
                 #fff 0%, rgba(255,255,255,.96) 28%, rgba(248,251,255,.55) 55%, rgba(240,246,255,0) 78%);
    }
    #camera-page-flash .cf-warm{ background:radial-gradient(ellipse 90% 80% at 50% 50%,
                 rgba(255,241,222,.9) 0%, rgba(255,236,208,.45) 45%, rgba(255,232,200,0) 80%); }
    /* ── THE BLOOM (Mark 2026-08-12: "photo realistic flash lightbloom") ──────────────────────── [REF#MG-00032]
       A real flash does not paint the frame evenly — the bulb blows out a hot centre that BLEEDS
       outward as the sensor/eye saturates. This layer is that bleed: it starts small and hot and
       expands past the viewport while fading, so the white-out reads as light spilling rather than
       a white rectangle being switched on.
       ⚠ NO `filter: blur()` HERE, DELIBERATELY. Blur on a full-viewport layer is a real per-frame
       GPU cost and this composites OVER a live 4K render — the many-stop radial gradient already
       gives the soft falloff blur would, and gradient + transform + opacity stay on the compositor
       with no repaint. If someone "improves" this with a blur filter, that is a render-path cost
       added for a cosmetic that already looks right. Don't.
       scale() only, never width/height — the latter would relayout every frame. */
    #camera-page-flash .cf-bloom{
      background:radial-gradient(circle at 50% 46%,
                 #ffffff 0%, rgba(255,255,255,.92) 12%, rgba(252,253,255,.72) 24%,
                 rgba(240,247,255,.44) 38%, rgba(226,238,255,.20) 52%,
                 rgba(214,232,255,.06) 68%, rgba(210,230,255,0) 82%);
      transform:scale(.5); will-change:opacity, transform;
    }
    /* ⚠ PEAK AT 0%, AND HOLD IT — DO NOT REINTRODUCE A RISE RAMP. [REF#MG-00033]
       The first cut ramped 0 → 1 over the first 4% (~12ms of 300ms) on the theory that it was
       "near-instant". It is SHORTER THAN ONE FRAME: at 60fps the compositor samples every ~16.7ms, so
       frames land either side of the spike and the full-white peak is never composited at all. Measured
       with rAF sampling: the sheet peaked at 0.49 and the core at 0.28 — a half-strength flash, which is
       not what Mark asked for and is invisible as a "whole page lights up".
       A xenon flash has no perceptible ramp anyway, so the correct shape is ALSO the realistic one:
       full brightness on the very first composited frame, held ~3 frames (18% of 300ms ≈ 54ms) so it
       cannot be skipped at any refresh rate, then the exponential falloff. */
    /* BIG (Mark 2026-08-12: "make there be a big photo flash when camera is clicked please"). The hold [REF#MG-00034]
       at full white went 18% of 300ms (~54ms) to 30% of 460ms (~138ms) — roughly 8 frames of total
       white-out at 60fps instead of 3 — and the whole envelope stretched 300 -> 460ms. This is the
       BRIGHTNESS/LENGTH dial, not a new effect; the peak-at-0% rule above is what makes it land at all. */
    @keyframes cf-sheet-k{ 0%{opacity:1} 30%{opacity:1} 46%{opacity:.66} 66%{opacity:.28} 84%{opacity:.08} 100%{opacity:0} }
    @keyframes cf-core-k { 0%{opacity:1} 24%{opacity:1} 44%{opacity:.60} 70%{opacity:.16} 100%{opacity:0} }
    @keyframes cf-warm-k { 0%{opacity:0} 6%{opacity:.20} 30%{opacity:.13} 100%{opacity:0} }
    /* Bloom outlives the sheet on purpose: the frame stops being pure white while the light is [REF#MG-00035]
       still spilling, which is what sells it as a discharge instead of a cut to white. Peaks at 0%
       like its siblings — same sub-frame-ramp trap documented above. */
    @keyframes cf-bloom-k{ 0%{opacity:1; transform:scale(.5)} 28%{opacity:1; transform:scale(1.15)}
                           58%{opacity:.42; transform:scale(1.72)} 100%{opacity:0; transform:scale(2.1)} }
    #camera-page-flash.cf-fire .cf-sheet{ animation:cf-sheet-k 460ms cubic-bezier(.05,.7,.2,1) forwards; }
    #camera-page-flash.cf-fire .cf-core { animation:cf-core-k  330ms cubic-bezier(.05,.7,.2,1) forwards; }
    #camera-page-flash.cf-fire .cf-bloom{ animation:cf-bloom-k 560ms cubic-bezier(.05,.7,.2,1) forwards; }
    #camera-page-flash.cf-fire .cf-warm { animation:cf-warm-k  620ms ease-out forwards; }
    @media (prefers-reduced-motion: reduce){
      /* Still legible as "the flash fired", without a full-screen white-out. [REF#MG-00036] */
      @keyframes cf-sheet-k{ 0%{opacity:0} 10%{opacity:.22} 100%{opacity:0} }
      @keyframes cf-core-k { 0%{opacity:0} 10%{opacity:.28} 100%{opacity:0} }
      @keyframes cf-warm-k { 0%{opacity:0} 15%{opacity:.08} 100%{opacity:0} }
      #camera-page-flash.cf-fire .cf-sheet{ animation-duration:180ms; }
      #camera-page-flash.cf-fire .cf-core { animation-duration:160ms; }
      #camera-page-flash.cf-fire .cf-warm { animation-duration:200ms; }
    }
  </style>
  <!-- Paint order = document order (all siblings, no z-index): warm tail at the back, then the [REF#MG-00037]
       full-frame sheet, then the expanding bloom, with the hot core on top. -->
  <div id="camera-page-flash" aria-hidden="true">
    <div class="cf-l cf-warm"></div>
    <div class="cf-l cf-sheet"></div>
    <div class="cf-l cf-bloom"></div>
    <div class="cf-l cf-core"></div>
  </div>

  <div id="fpv-viewport" role="region" aria-label="Dungeon view (3D). Everything here is also reachable as text from the guidebook — press F1.">
    <!-- ⚠ THIS TOKEN IS THE ENGINE'S ONLY CACHE-BUST. BUMP IT ON EVERY Engine9 CHANGE. ⚠ [REF#MG-00038]
         Mark 2026-07-19: it sat at 8.2.162-tp-hook across NINE engine commits (8.2.163-8.2.171) while sw.js's
         CACHE constant was dutifully bumped each time — but sw.js is a NO-CACHE PASS-THROUGH whose own header
         says "iframe ?v= query-string busts own freshness". Bumping sw.js therefore did NOTHING for the engine:
         the browser kept serving a cached 8.2.162 Engine9, so the TDZ boot fix, Dancer's placement, her stage
         settings, the felt seating trace, the dice card, the crew moves and the hand raise were all invisible
         in-game. Every "nothing changed" report in that window was correct.
         The BUILD line in COPY-ALL prints this exact token (~19434) — if it does not match the newest engine
         commit, the player is on a stale build and NO diagnosis of their console is trustworthy. Check it FIRST. -->
    <script>
      // FRESH DUNGEON DURING THE LOADER (Mark 2026-07-25 "load the dungeon during progressbar, not after role only"). [REF#MG-00039]
      // Stage a fresh root only when a NEW GAME/Quit path removed the old one. A browser refresh is Continue, not a
      // hidden reroll: it keeps the session seed and the P1 durable run ledger. Floor transitions, save-load (LOAD_NOW)
      // and same-seed retry (RETRY_RUN) reload ONLY the engine iframe — this shell script does not re-run — and those
      // paths stage their own seed just before that reload, so they are unaffected and keep their dungeon.
      // RESUME AN INTERRUPTED SESSION (Mark 2026-09-12: "there is an auto resume ONLY if there was a refresh or browser
      // tab close"). Before minting anything, look for the engine's live-run marker (localStorage origami.v8.run.live —
      // written only while a chosen-role, living player was in play; cleared by every New Game / Quit). It counts only if
      // a ledger bank actually holds a snapshot for that run + floor — otherwise this is a fresh visit and the terms page
      // is the right answer (the 09-01 order). A tab close loses sessionStorage, so the marker re-supplies the root seed;
      // a refresh still has it, and the two must agree. Engine side: the RESUME block (Engine9 ~:7343) reads
      // origami.v8.resume; Panels skips the terms page when it sees the same flag.
      try {
        const _live = JSON.parse(localStorage.getItem('origami.v8.run.live') || 'null');
        const _sessSeed = sessionStorage.getItem('origami.v8.seed');
        let _resume = null;
        const _newRunIntent = sessionStorage.getItem('origami.v8.run.new') === '1';   // a deliberate Quit / New Game — never resume over it [REF#MG-00219]
        // A MARKER AGES OUT (Mark 2026-09-12: "guidebook wont load on game start"): the marker never expired, so every [REF#MG-00224]
        // launch after the first checkpoint was read as "tab closed, resume" and the terms/guidebook page never showed
        // again. A refresh, or a tab closed and reopened within the window, is an interruption; a launch hours later is a
        // game start — guidebook, role page, fresh run (a saved run is still there under LOAD). Knob: window._resumeWindowMs
        // (30 min) — set before this script runs, or localStorage origami.v8.resumeWindowMin for a persistent override.
        let _windowMs = (typeof window._resumeWindowMs === 'number') ? window._resumeWindowMs : 30 * 60 * 1000;
        try { const _m = parseFloat(localStorage.getItem('origami.v8.resumeWindowMin')); if (_m > 0) _windowMs = _m * 60 * 1000; } catch (_) {}
        const _fresh = !!(_live && typeof _live.at === 'number' && (Date.now() - _live.at) <= _windowMs);
        if (!_newRunIntent && _fresh && _live && _live.runId && _live.rootSeed && parseInt(_live.floor, 10) >= 1 && (!_sessSeed || String(_sessSeed) === String(_live.rootSeed))) {
          const _hasSnap = ['origami.v8.run.ledger.a', 'origami.v8.run.ledger.b'].some(k => {
            try { const b = JSON.parse(localStorage.getItem(k) || 'null'); const st = b && b.state; const f = st && st.runId === _live.runId && st.floors && st.floors[String(_live.floor)]; return !!(f && f.snapshot && typeof f.snapshot === 'object'); }
            catch (_) { return false; }
          });
          // ⛔ SUPERSEDED 2026-09-17 by Mark: "refresh isn't working well - lets disable that for now - when browser [REF#MG-00241]
          // is reset - the game is too for now - rely only on save. it works better." — the live marker is no longer
          // adopted; a refresh boots a fresh game and SAVE/LOAD is the way back. The 09-15 soft refresh and the 09-14
          // reload ladder below are kept behind window._resumeOnRefresh = true (set before this script runs). [REF#PENDING]
          if (_hasSnap && window._resumeOnRefresh === true) _resume = _live;
          if (_hasSnap && window._resumeOnRefresh !== true) window._resumeSkipped = 'disabled';   // probe handle [REF#MG-00242]
        }
        // ── THE RELOAD LADDER (Mark 2026-09-14: "some sort of testing if user has reloaded more than 3x and its same load [REF#MG-00232]
        //    that we assume there is an error and reset that level … clear it automatically on 2nd reload, and just restart
        //    that level you are seeing, on 3rd reload just restart the entire game from beginning"). A checkpoint that
        //    locks the game up (the cabaret refresh, 09-14) would otherwise be resumed forever. The marker carries
        //    `resumes`: how many times in a row THIS checkpoint has been resumed without the player getting anywhere
        //    afterwards — the engine's marker writer keeps the count until the player has walked three tiles since the
        //    resume (a 60 s tick or the refresh's own pagehide must not clear it: a stuck player still checkpoints).
        //      reload 1 → resume where they were
        //      reload 2 → resume the RUN (stats, inventory, floors done) but THIS FLOOR starts fresh at the stairs
        //      reload 3 → no resume: a new game from the beginning. Save slots are never touched — and the first
        //                 resume writes an "Auto-rescue" slot (Panels) so a player who never pressed SAVE still has one.
        //    Knobs: window._reloadLadder = false (off) · _reloadFloorResetAt (2) · _reloadGameResetAt (3).
        // ── THE SOFT REFRESH OUT OF SECTION 0 (Mark 2026-09-15: "if refresh occurs inside caberet - the entire scene gets locked
        //    up - player is stuck in door etc." → first "just restart game", then, the same hour: "I would think that refresh is
        //    great in case of power outages and such … perhaps we can create a soft refresh" → "soft refresh - we want to be the
        //    helpful game. :)") ── the live marker carries `seg` (the engine's marker writer). A checkpoint taken in section 0 —
        //    the head: hall, cabaret, 番所 — is resumed SOFT: the RUN comes back (role, gold, XP, inventory, pets' growth, floors
        //    done, the Auto-rescue slot) but the floor starts fresh at the stairs — the ladder's own step 2, so the exact pose
        //    that locked the cabaret is never restored. A second refresh with no progress is step 2 again; a third is the new
        //    game, as before. Sections 1+ and deeper floors keep the exact-spot resume.
        //    ⛔ SUPERSEDED 2026-09-15 by Mark ("soft refresh"): the same-day "just restart game" — a seg-0 marker was DROPPED.
        //    Knob: window._resumeSkipSection0 = false (exact-spot resume everywhere, the 09-14 behaviour).
        // behind _resumeOnRefresh since 2026-09-17 (see ⛔ above)
        const _softSec0 = !!(_resume && window._resumeSkipSection0 !== false && parseInt(_resume.seg, 10) === 0);
        window._resumeSoft = _softSec0 ? 'section0' : null;   // probe handle [REF#MG-00236]
        let _ladder = 0;
        // behind _resumeOnRefresh since 2026-09-17 (see ⛔ above) [REF#MG-00243]
        if (_resume && window._reloadLadder !== false) {
          _ladder = (parseInt(_resume.resumes, 10) || 0) + 1;
          const _floorAt = (typeof window._reloadFloorResetAt === 'number') ? window._reloadFloorResetAt : 2;
          const _gameAt  = (typeof window._reloadGameResetAt  === 'number') ? window._reloadGameResetAt  : 3;
          if (_ladder >= _gameAt) {
            try { localStorage.removeItem('origami.v8.run.live'); } catch (_) {}
            try { sessionStorage.setItem('origami.v8.reloadLadder', 'game'); } catch (_) {}
            window._resumeSkipped = 'ladder-' + _ladder;
            _resume = null;
          } else {
            try { localStorage.setItem('origami.v8.run.live', JSON.stringify(Object.assign({}, _live, { resumes: _ladder }))); } catch (_) {}
            if (_ladder >= _floorAt || _softSec0) { try { sessionStorage.setItem('origami.v8.reloadLadder', 'floor'); } catch (_) {} }   // the soft refresh rides step 2 (2026-09-15) [REF#MG-00237]
            else { try { sessionStorage.removeItem('origami.v8.reloadLadder'); } catch (_) {} }
          }
          window._reloadLadderStep = _ladder;   // probe handle [REF#MG-00233]
        } else if (_resume && _softSec0) {
          try { sessionStorage.setItem('origami.v8.reloadLadder', 'floor'); } catch (_) {}   // the ladder is off but the soft refresh still holds [REF#MG-00238]
        }
        if (_resume) {
          sessionStorage.setItem('origami.v8.seed', String(_resume.rootSeed));
          sessionStorage.setItem('origami.v8.resume', '1');
          if (_resume.role) sessionStorage.setItem('origami.v8.role', String(_resume.role));
          sessionStorage.removeItem('origami.v8.loadSave');
          sessionStorage.removeItem('origami.v8.descent');
          window._resumeLive = _resume;
        } else {
          if (_live) {
            localStorage.removeItem('origami.v8.run.live');   // a marker with nothing behind it, a different session seed, or one past the window is noise, not a run [REF#MG-00220]
            window._resumeSkipped = window._resumeSkipped || (_live && !_fresh ? 'stale' : 'unbacked');   // probe handle (smoke-save.js); the ladder's own label wins when it dropped the marker [REF#MG-00225]
          }
          if (!sessionStorage.getItem('origami.v8.loadSave')) {
            for (const k of ['origami_card_uses','origami_hand_stacks','origami_hand_splits','origami_hand_order','origami_hand_face']) { try { localStorage.removeItem(k); } catch (_) {} }   // Mark 2026-09-17: "card inventory is blanked out … not to carry that inventory forward on a refresh" [REF#MG-00244]
          }
        }
      } catch (_) {}
      try {
        // A NEW GAME IS A NEW DUNGEON (Mark 2026-09-21: "stop that seed - its a new dungeon every new game - that was the [REF#MG-00250]
        // promise" + "there is no resume other than save/restore"). This block used to mint a root only when sessionStorage
        // had none — so every same-tab launch (F5, the terms page, New Game) re-rolled the SAME map, monsters and loot,
        // while the 09-17 order already said a refresh is a fresh game. Now EVERY shell load mints a fresh root. The one
        // thing that carries a seed back in is a pending LOAD handoff (origami.v8.loadSave — the engine's restore writes
        // the save's own seed beside it, ~:62288); a descent reloads only the engine iframe and never reaches this block.
        // ⛔ SUPERSEDED 2026-09-21: the resume branch above (already behind _resumeOnRefresh) can no longer hold a seed
        // across this line either — Mark: no resume but save/restore. Knob (old behaviour): window._freshSeedOnLoad = false.
        // LONG-TASK LEDGER (2026-10-09, Mark: "big lag in combat … just locks up for 5 sec"): the engine's HITCHES line can only say
        //    "outside-loop" — it cannot name the frame that held the thread. The browser can: a longtask entry's attribution carries
        //    the owning container (the engine iframe, the Panels iframe, or this shell). Every task ≥ 300 ms is kept in
        //    window._longTasks (last 40) and Oni-Baba's COPY ALL prints them beside HITCHES. Off: window._longTaskLedger = false.
        try { if (window._longTaskLedger !== false && typeof PerformanceObserver === 'function') {
            window._longTasks = [];
            new PerformanceObserver((list) => { try { for (const e of list.getEntries()) { if (e.duration < 300) continue;
                const a = (e.attribution || [])[0] || {}; const src = String(a.containerSrc || '').split('?')[0].split('/').pop();
                window._longTasks.push({ at: new Date().toTimeString().slice(0, 8), ms: Math.round(e.duration), frame: src || (a.containerType || 'top'), id: a.containerId || '', name: e.name });
                if (window._longTasks.length > 40) window._longTasks.shift();
                } } catch(_){} })
              .observe({ entryTypes: ['longtask'] }); } } catch(_){}
        // Bounded synchronous operation timings; no rendering, logging, or policy changes. [REF#MG-00301]
        window._lagSpans = [];
        const _lagTotals = new Map();
        window._measureFrameWork = function(frame, operation, run) {
            if (window._lagTiming === false) return run();
            const start = performance.now();
            try { return run(); }
            finally {
                const ms = performance.now() - start, key = frame + '/' + operation;
                let total = _lagTotals.get(key);
                if (!total && _lagTotals.size < 32) {
                    total = { n:0, ms:0, max:0 }; _lagTotals.set(key, total);
                }
                if (total) { total.n++; total.ms += ms; total.max = Math.max(total.max, ms); }
                if (ms >= 8) {
                    window._lagSpans.push({ frame, operation, start:performance.timeOrigin + start, ms });
                    if (window._lagSpans.length > 60) window._lagSpans.shift();
                }
            }
        };
        window._lagTimingDump = function() {
            return '\n── OPERATION TIMINGS (elapsed synchronous time; nested spans overlap) ──\n'
                + [..._lagTotals].map(([k,t]) => k + ': ' + t.n + ' calls, max ' + t.max.toFixed(1) + 'ms, mean ' + (t.ms/t.n).toFixed(2) + 'ms').join('\n')
                + '\nRecent operations ≥8ms (epoch start permits cross-frame correlation):\n'
                + window._lagSpans.slice(-20).map(s => s.start.toFixed(1) + ' · ' + s.frame + '/' + s.operation + ' ' + s.ms.toFixed(1) + 'ms').join('\n');
        };
        const _loadPending = !!sessionStorage.getItem('origami.v8.loadSave');
        if (window._freshSeedOnLoad !== false && !_loadPending) {
          let seed = 0;
          try { const values = new Uint32Array(1); crypto.getRandomValues(values); seed = values[0]; } catch (_) {}
          if (!seed) seed = ((Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0) || 1;
          sessionStorage.setItem('origami.v8.seed', String(seed));
          // This is the only full-shell path that creates a new root. Mark it [REF#MG-00040]
          // so Engine9 discards any half-finished handoff before legacy restore
          // logic can revive an old run over the player’s New Game.
          sessionStorage.setItem('origami.v8.run.new', '1');
          sessionStorage.removeItem('origami.v8.run.id');
          sessionStorage.removeItem('origami.v8.loadSave');
          sessionStorage.removeItem('origami.v8.descent');
        }
      } catch (_) {}
    </script>

       "a new one I am building where she sings a solo about dreaming to be a mortal in paris, and the

       ⚠ WHY DOM AND NOT THE .gltf, stated properly because Mark asked for it on a premise that is not
       quite right. He suggested CSS to "offset to the CPU calcs" — it does not: browsers composite
       transforms, opacity and filters on the GPU, so a full-screen translucent layer is the same

  <script>
  /* ── LA TOUR EIFFEL, DRAWN RATHER THAN MODELLED (Mark 2026-07-31) ─────────────────────────────── [REF#MG-00044]
     Mark asked for "a better css/animation of the eiffel tower even more detailed that doesnt use hard
     opengl code". This builds the lattice as SVG geometry — the struts are REAL, not a texture of
     struts — which is why it can be more detailed than the .gltf and still cost one composited layer.

     THE PROFILE IS THE REAL ONE. Gustave Eiffel shaped the tower so wind pressure is carried straight
     to the ground, which gives an exponential taper rather than a straight cone. half(t) uses a power
     curve between base and top half-width; the 0.62 exponent is what produces the characteristic flare
     at the feet instead of a pyramid. Drawn as FOUR edges — two outer, two inner at 34% — so the turn
     reads as a solid object rather than a flat cut-out, without any 3D geometry.

     Everything is stroke-only on a transparent ground: the "95% transparent" Mark asked for comes from
     the overlay's own opacity, so the detail stays crisp instead of being washed out per-stroke. */
  function _buildParisDream(stage){
    if (!stage) return;
    const W = 400, H = 820, BASE = 792, TOP = 30, SPAN = BASE - TOP;
    const HB = 146, HT = 7;                       // half-width at the feet / at the mast [REF#MG-00045]
    const DECK1 = 0.19;                           // first platform — BELOW it the tower is four open legs [REF#MG-00046]
    // EIFFEL'S OWN CURVE. He shaped the tower so wind pressure resolves straight into the ground, [REF#MG-00047]
    // which makes the profile an EXPONENTIAL in height — half(t) = HB·(HT/HB)^t. The first version used
    // t^0.62 inside that exponent for extra flare, and it flattened the feet to horizontal: with an
    // exponent below 1 the width changes fastest at t=0, so the legs met the ground lying down. 0.92
    // keeps a touch of the flare everyone recognises while leaving the feet a real angle.
    const half = t => HB * Math.pow(HT / HB, Math.pow(t, 0.92));
    const yOf  = t => BASE - t * SPAN;
    const cx   = W / 2;
    const P = [];                                  // path/line fragments [REF#MG-00048]
    const line = (x1, y1, x2, y2, w, o) =>
      P.push('<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) +
             '" y2="' + y2.toFixed(1) + '" stroke-width="' + w + '" opacity="' + o + '"/>');

    // ── THE FOUR EDGES. Sampled finely so the curve is smooth at any size. [REF#MG-00049]
    const edge = (k, w, o) => {
      let d = '';
      for (let i = 0; i <= 120; i++){
        const t = i / 120, x = cx + k * half(t), y = yOf(t);
        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      P.push('<path d="' + d + '" fill="none" stroke-width="' + w + '" opacity="' + o + '"/>');
    };
    edge(-1, 3.1, 0.95); edge(1, 3.1, 0.95);       // outer legs [REF#MG-00050]
    edge(-0.34, 1.9, 0.55); edge(0.34, 1.9, 0.55); // inner legs — the depth cue on a flat drawing [REF#MG-00051]

    // ── PLATFORMS. Three, at the real proportions (~57m, ~115m, ~276m of 300m). [REF#MG-00052]
    const DECKS = [0.19, 0.38, 0.92];
    for (const t of DECKS){
      const h = half(t) * 1.14, y = yOf(t);
      P.push('<rect x="' + (cx - h).toFixed(1) + '" y="' + (y - 7).toFixed(1) + '" width="' +
             (h * 2).toFixed(1) + '" height="14" rx="2" fill="none" stroke-width="2.6" opacity="0.9"/>');
      for (let i = 0; i <= 26; i++){               // deck balustrade [REF#MG-00053]
        const x = cx - h + (i / 26) * h * 2;
        line(x, y - 7, x, y + 7, 1, 0.5);
      }
    }

    // ── THE LATTICE. Each bay gets a horizontal tie and an X, on both the outer and inner faces. [REF#MG-00054]
    // Bay height shrinks with the taper so the mesh stays visually even all the way up — a constant
    // step would leave the top looking bare and the base looking clogged.
    const bays = [];
    // ⚠ STARTS ABOVE THE FIRST PLATFORM. The first render ran the mesh all the way to the ground and [REF#MG-00055]
    // the tower came out wearing a SKIRT — a solid flare of struts instead of four open legs. On the
    // real tower everything below the first platform is four legs and the arch; the dense lattice
    // begins above it. Screenshotting it is what caught this; the numbers all looked fine.
    { let t = DECK1 + 0.005; while (t < 0.995){ bays.push(t); t += 0.0115 + 0.030 * Math.pow(t, 1.35); } }
    for (let i = 0; i < bays.length - 1; i++){
      const t0 = bays[i], t1 = bays[i + 1];
      const y0 = yOf(t0), y1 = yOf(t1);
      for (const k of [1, 0.34]){                  // outer face, then the inner one [REF#MG-00056]
        const a0 = half(t0) * k, a1 = half(t1) * k;
        const o = k === 1 ? 0.62 : 0.34, w = k === 1 ? 1.15 : 0.85;
        line(cx - a0, y0, cx + a0, y0, w, o * 0.7);            // horizontal tie [REF#MG-00057]
        line(cx - a0, y0, cx + a1, y1, w, o);                  // X brace [REF#MG-00058]
        line(cx + a0, y0, cx - a1, y1, w, o);
      }
    }

    // ── THE LEGS. Four open piers, tied at a few heights only — the space between them is the point. [REF#MG-00059]
    for (let i = 1; i <= 5; i++){
      const t = (i / 6) * DECK1, y = yOf(t), a = half(t), b = half(t) * 0.34;
      line(cx - a, y, cx - b, y, 1.1, 0.42);
      line(cx + b, y, cx + a, y, 1.1, 0.42);
      if (i % 2 === 0){                            // sparse bracing inside each pier [REF#MG-00060]
        const t2 = ((i + 1) / 6) * DECK1, y2 = yOf(t2), a2 = half(t2), b2 = half(t2) * 0.34;
        line(cx - a, y, cx - b2, y2, 0.9, 0.30); line(cx - b, y, cx - a2, y2, 0.9, 0.30);
        line(cx + a, y, cx + b2, y2, 0.9, 0.30); line(cx + b, y, cx + a2, y2, 0.9, 0.30);
      }
    }
    // ── THE GREAT ARCH — the detail that makes it unmistakable. Sprung between the inner faces of the [REF#MG-00061]
    //    legs and drawn OPEN: the first version hatched it down to the ground with voussoirs, which is
    //    what filled the base in.
    { const t = DECK1 * 0.86, y = yOf(t), h = half(t) * 0.92, r = h * 1.05;
      P.push('<path d="M' + (cx - h).toFixed(1) + ' ' + y.toFixed(1) +
             ' A' + r.toFixed(1) + ' ' + (r * 0.55).toFixed(1) + ' 0 0 1 ' + (cx + h).toFixed(1) + ' ' + y.toFixed(1) +
             '" fill="none" stroke-width="2.6" opacity="0.85"/>');
      const yd = yOf(DECK1);
      for (let i = 3; i < 18; i++){                // hangers between the arch and the deck ABOVE it [REF#MG-00062]
        const a = Math.PI * (i / 20), ax = cx - Math.cos(a) * h, ay = y - Math.sin(a) * r * 0.55;
        line(ax, ay, ax, yd, 0.85, 0.26);
      }
    }

    // ── THE MAST. She is dreaming of the top of it. [REF#MG-00063]
    { const yTop = yOf(1);
      line(cx, yTop, cx, yTop - 66, 2.4, 0.95);
      for (let i = 0; i < 7; i++){ const yy = yTop - 8 - i * 8, hw = 5.5 - i * 0.6; line(cx - hw, yy, cx + hw, yy, 1, 0.5); }
      P.push('<circle cx="' + cx + '" cy="' + (yTop - 70).toFixed(1) + '" r="3.4" fill="currentColor" opacity="0.95"/>');
    }

    stage.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" ' +
      'stroke="#dbe7ff" fill="none" stroke-linecap="round" color="#eaf2ff" ' +
      'style="color:#eaf2ff">' + P.join('') + '</svg>';
    try { console.log('[DREAM] la tour eiffel drawn — ' + P.length + ' vector members, 0 WebGL programs.'); } catch(_){}
  }
  try { window._buildParisDream = _buildParisDream; } catch(_){}
  </script>

  <!-- ── ON-DEVICE CONSOLE (?mconsole=1) — Mark 2026-07-04, mobile forensics ───────────────────────── [REF#MG-00066]
       Phones die where no DevTools can see. Append ?mconsole=1 to the URL for a live overlay that
       captures window.onerror + unhandledrejection from ALL THREE frames (same-origin), the
       ENGINE_LOAD_PROGRESS / ENGINE_ANOMALY bus, and a JS-heap sample every 2s. Zero cost when off
       (guarded before any work). Ships in the public dist deliberately — this is how we debug the
       device in Mark's hand. -->
  <script>
  (function(){
    if (!/[?&]mconsole=1/.test(location.search)) return;
    // CRASH-SURVIVING TRACER (Mark 2026-07-04 "57% then reboots constantly... some sort of tracer to [REF#MG-00067]
    // copy paste back"): a reboot loop wipes an in-page console, so every line ALSO lands in a
    // localStorage ring as it happens. After a crash-reload the previous run's tail is shown (amber,
    // labeled CRASHED — a clean exit writes an end-marker; its absence = the tab was killed) and the
    // COPY button puts the merged trace on the clipboard.
    var LS_KEY = 'origami.mtrace', LS_MAX = 300;
    var store = { get: function(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(_) { return []; } },
                  set: function(v){ try { localStorage.setItem(LS_KEY, JSON.stringify(v.slice(-LS_MAX))); } catch(_){} } };
    var prev = store.get();
    var prevCrashed = prev.length > 0 && prev[prev.length - 1].indexOf('CLEAN_EXIT') === -1;
    var runHdr = '=== RUN ' + new Date().toISOString() + ' ===';
    var trace = prevCrashed ? prev.concat([runHdr]) : [runHdr];
    store.set(trace);
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;z-index:2147483647;background:rgba(5,10,14,.92);color:#9be8ff;font:10px/1.5 monospace;padding:6px 8px 6px;border-top:1px solid #22d3ee;pointer-events:auto;white-space:pre-wrap;word-break:break-all';
    function copyTrace(done){
      var txt = store.get().join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
      else { var ta = document.createElement('textarea'); ta.value = txt; box.appendChild(ta); ta.select(); try { done(document.execCommand('copy')); } catch(_) { done(false); } ta.remove(); }
    }
    var copyBtn = document.createElement('button');
    copyBtn.textContent = '📋 COPY TRACE';
    copyBtn.style.cssText = 'position:sticky;top:0;float:right;background:#0e2a33;color:#22d3ee;border:1px solid #22d3ee;border-radius:6px;font:700 11px monospace;padding:4px 10px;margin:0 0 4px 8px';
    copyBtn.onclick = function(){
      copyTrace(function(ok){ copyBtn.textContent = ok ? '✓ COPIED' : '✗ long-press to select'; setTimeout(function(){ copyBtn.textContent = '📋 COPY TRACE'; }, 2000); });
    };
    box.appendChild(copyBtn);
    // MIN/MAX (Mark 2026-07-04 "close trace panel min/max — just the button; when clicked the console [REF#MG-00068]
    // comes up AND at the same time it's copied to clipboard"): the console starts MINIMIZED as one
    // floating 🐛 chip (bottom-right, above the version badge). Tap → panel expands + trace auto-copies
    // in the same gesture (mobile-friendly: one thumb, evidence already on the clipboard). Tap ✕ TRACE
    // to minimize again. Desktop debugging unchanged apart from starting minimized too — one tap to open.
    var minBtn = document.createElement('button');
    minBtn.textContent = '🐛 TRACE';
    minBtn.style.cssText = 'position:fixed;right:8px;bottom:28px;z-index:2147483647;background:rgba(5,10,14,.92);color:#22d3ee;border:1px solid #22d3ee;border-radius:14px;font:700 11px monospace;padding:5px 11px;pointer-events:auto';
    var minB2 = document.createElement('button');
    minB2.textContent = '✕ TRACE';
    minB2.style.cssText = copyBtn.style.cssText + ';float:left;margin:0 8px 4px 0';
    box.insertBefore(minB2, copyBtn);
    box.style.display = 'none';                    // start minimized — just the chip [REF#MG-00069]
    minBtn.onclick = function(){
      box.style.display = 'block'; minBtn.style.display = 'none';
      copyTrace(function(ok){ copyBtn.textContent = ok ? '✓ AUTO-COPIED' : '📋 COPY TRACE'; setTimeout(function(){ copyBtn.textContent = '📋 COPY TRACE'; }, 2500); });
    };
    minB2.onclick = function(){ box.style.display = 'none'; minBtn.style.display = 'block'; };
    var n = 0;
    function line(tag, msg){
      n++;
      var t = ((performance.now())/1000).toFixed(1);
      var rec = 't+' + t + 's [' + tag + '] ' + String(msg).slice(0, 300);
      trace.push(rec); store.set(trace);
      var d = document.createElement('div');
      if (/ERR|REJ|ANOMALY/.test(tag)) d.style.color = '#ff8899';
      d.textContent = rec;
      box.appendChild(d);
      if (n > 200) box.removeChild(box.children[1]);   // keep the COPY button (child 0) [REF#MG-00070]
      box.scrollTop = box.scrollHeight;
    }
    // Show the previous (crashed) run's tail FIRST — that's the forensics the reboot loop was eating. [REF#MG-00071]
    if (prevCrashed) {
      var hdr = document.createElement('div');
      hdr.style.color = '#ffcc66';
      hdr.textContent = '=== PREVIOUS RUN CRASHED — last ' + Math.min(prev.length, 25) + ' lines (COPY TRACE sends all) ===';
      box.appendChild(hdr);
      prev.slice(-25).forEach(function(r){ var d = document.createElement('div'); d.style.color = '#ffcc66'; d.textContent = r; box.appendChild(d); n++; });
    }
    window.addEventListener('pagehide', function(){ trace.push('t+' + ((performance.now())/1000).toFixed(1) + 's [mconsole] CLEAN_EXIT'); store.set(trace); });
    function hook(w, name){
      try {
        w.addEventListener('error', function(e){ line('ERR:' + name, (e.message || e.type) + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); }, true);
        w.addEventListener('unhandledrejection', function(e){ line('REJ:' + name, e.reason && (e.reason.stack || e.reason.message || e.reason)); });
      } catch(err){ line('ERR:hook', name + ' ' + err); }
    }
    document.addEventListener('DOMContentLoaded', function(){
      document.body.appendChild(box);
      document.body.appendChild(minBtn);   // the minimized 🐛 chip (box starts hidden) [REF#MG-00072]
      line('mconsole', 'armed · ' + navigator.userAgent.slice(0, 80));
      line('mconsole', 'screen ' + screen.width + 'x' + screen.height + ' dpr ' + devicePixelRatio + ' mem ' + (navigator.deviceMemory || '?') + 'GB cores ' + (navigator.hardwareConcurrency || '?'));
      hook(window, 'shell');
      ['engine-iframe', 'panels-iframe'].forEach(function(id){
        var f = document.getElementById(id);
        if (f) f.addEventListener('load', function(){ try { hook(f.contentWindow, id.split('-')[0]); line('mconsole', id + ' hooked'); } catch(e){ line('ERR:hook', id + ' ' + e); } });
      });
      window.addEventListener('message', function(e){
        var d = e.data || {};
        if (d.type === 'ENGINE_LOAD_PROGRESS') line('LOAD', d.progress + '% ' + (d.text || ''));
        if (d.type === 'ENGINE_ANOMALY') line('ANOMALY', (d.kind || '') + ' ' + (d.error || ''));
        if (d.type === 'ENGINE8_READY') line('LOAD', 'ENGINE8_READY');
      });
      setInterval(function(){
        try {
          var m = performance.memory;
          if (m) line('MEM', (m.usedJSHeapSize/1048576).toFixed(0) + '/' + (m.jsHeapSizeLimit/1048576).toFixed(0) + ' MB heap');
        } catch(_){}
      }, 2000);
    });
  })();
  </script>

  <script>
    (function paintGitVersionBadge(){
        const el = document.getElementById('git-version-badge');
        if (!el) return;
        const v = window.GIT_VERSION;
        if (!v) { el.textContent = 'dev'; return; }
        const branchTag = (v.branch && v.branch !== 'main' && v.branch !== 'master')
            ? `<span class="gv-branch">[${v.branch}]</span>` : '';
        // WHEN this build was made, in Mark's words: "Aug 1, 2026 time 7pm" (2026-08-11). A sha answers [REF#MG-00074]
        // *which* build only if you can look it up; a date answers "am I even running today's build?" —
        // the question actually being asked when something looks stale. Local time on purpose: it is read
        // by a human sitting here, not correlated against a server log.
        const stamp = (iso) => {
            const d = new Date(iso || '');
            if (!iso || isNaN(d.getTime())) return '';
            const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            let h = d.getHours(); const ampm = h < 12 ? 'am' : 'pm';
            h = h % 12 || 12;                                  // 0 -> 12, 13 -> 1 [REF#MG-00075]

        el.innerHTML = `<span class="gv-copy">📋</span>${branchTag}<span class="gv-sha">${v.sha || '?'}</span>${builtTag ? ' · ' + builtTag : ''} — ${subject}`;

                `Commit: ${v.subject}`,
                `Built:  ${stamp(v.builtAt) || '?'}  (${v.builtAt || 'unknown'})`,
                `SW:     ${sw}`,

    // ENGINE URL FOR A FLOOR — keeps the boot ?v= cache-bust (Mark 2026-07-18 debug session). [REF#MG-00079]
    // THE BUG THIS FIXES: descend/ascend used to set `src = 'Origami.RealityEngine.9.html?floor=N'`, which

    const _bootV = (function(){

    // THE INVADING REALMS (2026-10-01): a realm trip carries realm/rn (into one) or fromRealm (home from one) — the engine reads them at [REF#MG-00268]
    // the top of its module (knowledge/design/SECRET_PORTAL_ROOM_2026-10-01.md). Positive integers only; anything else is dropped.
    function _engineUrlForFloor(floor, trip){
      let q = '';
      try { if (trip){ for (const k of ['realm', 'rn', 'fromRealm']){ const v = parseInt(trip[k], 10); if (v > 0) q += '&' + k + '=' + v; } } } catch(_){}
      try { if (trip){ for (const k of ['rtheme', 'rboss']){ const v = trip[k]; if (typeof v === 'string' && /^[a-z]{2,16}$/.test(v)) q += '&' + k + '=' + v; } } } catch(_){}   // the REALM PORTAL's roll (lowercase ids only)
      const mode = trip?.mode || (trip?.realm ? 'portal-new' : trip?.fromRealm ? 'portal-return' : 'new-floor');

    function _checkpointLiveRun(reason){

        if (sessionStorage.getItem('origami.v8.run.new') === '1') { try { localStorage.removeItem('origami.v8.run.live'); } catch (_) {} return; }

    // Floor-transition loading bar (Mark 2026-07-13): reset #descent-fade's real % bar to 0 and arm it, [REF#MG-00080]
    // so the engine's ENGINE_LOAD_PROGRESS posts drive a genuine progression bar during descend/ascend
    // instead of a blind timed fade.
    // DESCENT-BAR INSTRUMENT (Mark 2026-07-18: "level loading progress bar after going down stairs == doesnt show up.
    // why?"). The whole path reads correct statically — the engine posts DESCEND_REQUEST (~44411), this shell has the
    // case, and ENGINE8_READY (~45759) dismisses it — so guessing further would be guesswork. This records what
    // ACTUALLY happened at each hop so one playthrough convicts the real link instead of another theory:
    //   window._descentDiag()  → { requested, resetRan, activeApplied, progressPosts, lastPct, readyHid, lastErr }
    // If requested=false the engine never asked (stairs trigger / exit-locked gate). If requested=true but

    // reporting. If readyHid fires within a blink, something dismissed it early.
    window.__descentDbg = { requested:0, resetRan:0, activeApplied:0, progressPosts:0, lastPct:0, readyHid:0, lastErr:null, t0:0 };
    window._descentDiag = () => Object.assign({}, window.__descentDbg, {

      const bf=document.getElementById('descent-bar-fill'); if(bf) bf.style.width = '0%';

      const st=document.getElementById('descent-status');   if(st) st.textContent = '';
      const fn=document.getElementById('descent-floor-num');if(fn) fn.textContent = (typeof floor === 'number' && floor > 0) ? floor : '—';
      window.__descentActive = true; window.__descentPct = 0; window.__descentShown = 0;
      fade.classList.add('active');

    }
    // SMOOTH FILL (Mark 2026-07-18 "a better progress loading bar"). The engine's ENGINE_LOAD_PROGRESS posts arrive in [REF#MG-00081]
    // coarse, irregular jumps — the asset band throttles to ~8/s and the 13 world-build _yieldBuild chunks land as
    // single steps (8→10→15→22→30…), so the old bar visibly lurched and then sat frozen through the long chunks.
    // This eases a DISPLAYED value toward the real one every frame.
    // HONESTY RULE: the displayed value only ever approaches __descentPct — it NEVER runs ahead of, or invents,
    // progress. A fake creeping bar that outruns the real load is a lie to the player about what the game is doing;
    // this only removes the stutter between truthful samples. Idempotent — re-entrant calls don't stack rAF loops.
    function _descentEase(){
      if (window.__descentEasing) return;
      window.__descentEasing = true;
      const step = () => {
        if (!window.__descentActive){ window.__descentEasing = false; return; }

        if (target - shown < 0.15) shown = target;         // snap the last hair so 100% reads exactly 100% [REF#MG-00083]

        const pc = document.getElementById('descent-pct');      if (pc) pc.textContent = Math.round(shown) + '%';
        if (window.__realmPortalOpen) _rpBar(shown);

      };
      requestAnimationFrame(step);
    }

    // ONE dismissal path for the descent overlay, so world-ready and the safety timeout cannot fight. [REF#MG-00084]
    function _descentFinish(why){

    const _RP_TXT = {

    const _rpT = (k, p) => { const L = (window.currentLang === 'ja') ? 'ja' : 'en'; let v = (_RP_TXT[L] && _RP_TXT[L][k]) || _RP_TXT.en[k] || k;

    const _rpEl = (id) => document.getElementById(id);

    const _rpEsc = (v) => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const _RP_ITEM_H = 52;
    let _rpState = null;
    window.__realmPortalOpen = false; window.__realmPortalReady = false;
    function _rpBar(v){
      const f = _rpEl('rp-bar-fill'); if (f) f.style.width = v.toFixed(2) + '%';
      const pc = _rpEl('rp-pct'); if (pc) pc.textContent = Math.round(v) + '%';

    // a reel: `spins` passes over every row, then the row it lands on; returns the landing index [REF#MG-00272]
    function _rpFillReel(strip, order, table, land, spins){

    function _rpSpin(reel, strip, idx, ms, delay, done){

    function _rpFoe(){

      el.innerHTML = _rpState.bossLanded ? _rpT('foe', { name: _rpEsc(RT.bossName(_rpState.boss, _rpState.tone, (window.currentLang === 'ja') ? 'ja' : 'en')) }) : _rpEsc(_rpT('foeWait'));

    function _rpTone(tone, post){

    function _rpHoldFocus(prefer){

      set('rp-light', 'light'); set('rp-dark', 'dark'); set('rp-status', 'status0'); set('rp-hint', 'hint');
      const n = _rpEl('rp-realm-num'); if (n) n.textContent = String(o.realm || 1);
      const soon = RT.THEME_ORDER.filter(id => !RT.THEMES[id].built).map(id => _rpLbl(RT.THEMES[id]));
      const sn = _rpEl('rp-soonnote'); if (sn) sn.textContent = '';
      const play = _rpEl('rp-play'); if (play) { play.disabled = true; play.classList.remove('ready'); play.textContent = _rpT('loading'); }
      const ld = _rpEl('rp-load'); if (ld) ld.classList.remove('ready');
      _rpBar(0); _rpTone(_rpState.tone, false);
      const close = _rpEl('rp-close'), levels = _rpEl('rp-levels'), note = _rpEl('rp-levels-note');
      if (close) close.hidden = !o.confirming;
      if (levels) {
        let limit = 1;
        try {
          const progress = JSON.parse(localStorage.getItem('origami.realm.progress') || 'null');
          const wins = Math.max(0, Number(progress?.wins) || (localStorage.getItem('origami.realm.completed') === '1' ? 1 : 0));
          limit = Math.min(50, 1 + 5 * wins);
        } catch (_) {}
        for (const option of levels.options) option.disabled = Number(option.value) > limit;
        levels.disabled = !o.confirming || limit === 1; levels.value = String(Math.min(limit, _rpState.levels));
        if (note) note.textContent = limit === 1 ? 'Locked to 1 level. Each completed game unlocks 5 more, up to 50.' : 'Choose 1–' + limit + ' levels. Each completed game unlocks 5 more, up to 50.';
      }
      if (o.confirming) {
        if (play) { play.disabled = false; play.textContent = _rpT('play'); }

      } else if (ld) ld.hidden = false;
      const still = window._realmPortalReels === false || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      const ts = _rpEl('rp-theme-strip'), bs = _rpEl('rp-boss-strip'), tr = _rpEl('rp-reel-theme'), br = _rpEl('rp-reel-boss');
      if (ts && tr) _rpSpin(tr, ts, _rpFillReel(ts, RT.THEME_ORDER, RT.THEMES, o.theme, still ? 0 : 5), still ? 0 : 1900, 0, () => {

        case 'RETRY_RUN':
          {
            window.__engineReady = false;
            fpv.src = _engineUrlForFloor(1, { mode: 'floor-return' });
            cachedInit = null;
          }
          break;

        case 'ASCEND_REQUEST':
          {
            const floor = Math.max(1, Math.min(7, parseInt(ev.floor || 1, 10)));
            try { window.__descentDbg.requested++; } catch(_){}
            _descentReset((parseInt(ev.fromRealm, 10) > 0) ? `RETURNING HOME` : `ASCENDING`, floor);
            window.__engineReady = false;
            const destination = _engineUrlForFloor(floor, { fromRealm: ev.fromRealm,
                mode: ev.fromRealm ? 'portal-return' : 'floor-return' });
            setTimeout(() => {
              if (new URL(destination).searchParams.get('loadId') !== window._expectedDungeonLoadId) return;
              fpv.src = destination;
              cachedInit = null; // engine will re-init entities on the new floor [REF#MG-00194 → see REF#MG-00191]
            }, 600);
          }
          break;

        // ── i18n locale broadcast — Panels → SHELL → Engine ──────────────────────────────────── [REF#MG-00195]
        //    ⚠ THE SHELL MUST SET ITS OWN `currentLang` HERE. This case used to sit in the
        //    forward-only fallthrough group above: the message was relayed to the engine and the
        //    shell never recorded the language.
        //
        //    MEASURED 2026-08-10 (scripts/probe-oni-lang-scope.js), after switching to ja:
        //        currentLang   shell=(undefined)   panels=ja   engine=en
        //
        //    `js/v8/OniBaba8.js` runs in THIS frame, and every one of its language decisions
        //    (`_localLine`, `_localContext`, `_karmaTag`, `_fallbackNoun`) reads
        //    `window.currentLang` from here. With it permanently undefined, ALL of Oni-Baba's
        //    Japanese was unreachable — including the 66 ONIBABA_LINES_JA lines translated on
        //    2026-07-28, which had never once been selected. The translations were never the
        //    problem; nothing ever told this frame what language the game was in.
        //    (Mark 2026-08-10: "localize onibabas event log stop fighting me".)
        case 'LOCALE_CHANGE': {
          const _lang = (ev && typeof ev.lang === 'string') ? ev.lang : 'en';
          window.currentLang = _lang;
          try { if (window.oniBaba8) window.oniBaba8.lang = _lang; } catch (_) {}
          to(fpv, ev);      // engine still needs it for monster names + its inline ja ternaries [REF#MG-00196]
          break;
        }

        // Constructor protocol — Oni-Baba narrates build/validation events [REF#MG-00197]
        case 'CONSTRUCTOR_EVENT':
          to(panels, ev);
          break;
      }
    });

    // ── TASK-11: PROBE SEAM FOR GAME LOOP START (2026-08-10) ────────────────────────────────── [REF#MG-00198]
    // Probes cannot reliably detect when the game loop is running. __engineReady signals only that
    // the engine iframe has loaded, not that startLoop() has been called. This hook waits for BOTH
    // and times out with a clear error if the loop never starts — unblocking TASK-11 falsification.
    window._waitForGameLoopStart = async function(timeoutMs = 15000) {
      const start = performance.now();
      const checkInterval = 100;

      let readyAt = null;   // when __engineReady flipped — the signal probes wrongly trusted [REF#MG-00199]

      return new Promise((resolve, reject) => {
        const timer = setInterval(() => {
          const elapsed = performance.now() - start;

          // __engineReady is set on THIS (shell) window by the ENGINE8_READY handler above. [REF#MG-00200]
          // _loopStarted lives inside the engine iframe, set by startLoop().
          const engineReady = window.__engineReady === true;
          let loopStarted = false;
          try { loopStarted = fpv?.contentWindow?._loopStarted === true; } catch (_) {}

          if (engineReady && readyAt === null) readyAt = elapsed;

          if (engineReady && loopStarted) {
            clearInterval(timer);
            resolve({
              loopStarted: true,
              elapsed: Math.round(elapsed),
              engineReadyAt: readyAt === null ? null : Math.round(readyAt),
              // How long a probe that trusted __engineReady would have been measuring a dead game. [REF#MG-00201]
              blindWindowMs: readyAt === null ? null : Math.round(elapsed - readyAt),
            });
          } else if (elapsed > timeoutMs) {
            clearInterval(timer);
            reject(new Error(
              `game loop never started (timeout after ${Math.round(elapsed)}ms). ` +
              `engineReady=${engineReady}, loopStarted=${loopStarted}`
            ));
          }
        }, checkInterval);
      });
    };

    // ── PARENT→CHILD FRAME DRIVER — REMOVED 2026-07-16 (Mark: "continue fixing"). ────────────── [REF#MG-00202]
    // Was: `function parentRenderLoop(){ requestAnimationFrame(parentRenderLoop);
    //       if (window.__engineReady && fpv?.contentWindow) fpv.contentWindow.postMessage({type:'ENGINE_TICK'},'*'); }`
    // labelled "Un-throttled Parent-to-Child frame driver loop (120 FPS pipeline)".
    //
    // WHY REMOVED — it was a SECOND frame driver. The engine already runs its own vsync-capped
    // RAF (`driveRAF` → `loop()`, Engine9 ~38663) and logs "⚡ Single-RAF render drive initialized
    // (B016 decouple)" — but that decouple only deleted the old setInterval driver; THIS one
    // survived, so `loop()` was being called from BOTH the engine's RAF and this postMessage.
    // FPS.md §2 bans exactly this: "NEVER add a second driver … the old dual-drive pushed ~147
    // submissions/sec ≈ 2.5× a 60 Hz panel → command-queue flood → raster stall → the infamous
    // 63↔34 fps oscillation."
    //
    // EVIDENCE (Mark's 2026-07-16 console): a 5138ms frame gap whose stack was
    // `loop @ Engine9:38685 ← (anonymous) @ Engine9:37860 ← postMessage ← parentRenderLoop @ 9.html:616`,
    // alongside earlier hitches driven via `driveRAF` — i.e. both paths live. postMessage is async
    // and QUEUES: under main-thread congestion the ticks backlog, then the whole backlog delivers
    // in one task, each running a full loop()+render (the multi-second freeze). Under load the two
    // drivers also drift past the 6.83ms de-dupe gate in loop() (Engine9 ~38678) and BOTH execute,
    // doubling render work and worsening the congestion that caused the drift — a positive feedback
    // loop, and the 60↔37 oscillation in his rolling fps log.
    //
    // NOT A THROTTLE: this REMOVES redundant work. Every vsync frame still renders, via the
    // engine's own RAF, which self-caps to the display refresh. No frame cap, no DPR shed.
    //
    // The `targetFrameTime` gate at Engine9 ~38678 exists ONLY to de-dupe these two drivers and is
    // now vestigial (inert while _targetFps=120). Left in place deliberately as a safety net —
    // retire it as a SEPARATE validated change, never in the same commit as this one.
    //
    // Guard hole that hid this: scripts/probe-no-throttle.sh only ever scanned Engine9.html +
    // 3 modules — it has NEVER scanned this shell file. Same class of hole as the OniBaba
    // auto-downshift miss. Guard extended to cover the shell in this same commit.
    // — Claude (Opus), per Mark 2026-07-16.
  </script>

  <!-- ── Service Worker (offline play, 2026-05-25) ───────────────────────── [REF#MG-00203]
       Registers sw.js so the game runs without a network after the first
       visit. Wrapped in feature-detection so file:// or non-HTTPS dev
       contexts silently no-op. Bump the CACHE constant in sw.js to evict
       stale assets after a deploy. -->
  <script>
    // ⛔ SUPERSEDED 2026-09-04 — the blanket localhost disable is retired, because it is where the game [REF#MG-00216]
    //    is actually PLAYED. This block unregistered every worker and deleted every cache on each load
    //    for localhost/127.0.0.1, so offline support could never exist in the one environment that
    //    matters: two layers were switching it off, and fixing sw.js alone changed nothing.
    //    ⚠ ITS ORIGINAL PURPOSE IS NOT LOST, it moved into the worker: sw.js now serves CODE
    //      network-first, so a reachable dev server always wins and no seat can be handed a stale
    //      build. The freshness this block was protecting is now protected by the thing it was
    //      protecting against.
    //    Escape hatch for a seat who wants a browser with no worker at all — the old behaviour, on
    //    demand rather than always: add ?nosw=1 to the URL, or set localStorage.ogtNoSW = '1'.
    let _noSW = false;
    try {
        _noSW = new URLSearchParams(window.location.search).get('nosw') === '1'
             || localStorage.getItem('ogtNoSW') === '1';
    } catch (_) {}
    const isDev = _noSW;
    if (isDev) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log('[sw] Dev Mode: Unregistered service worker');
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) {
            caches.delete(name).then(() => {
              console.log('[sw] Dev Mode: Deleted cache', name);
            });
          }
        });
      }
    } else if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=8.4.2743-card-compile-finish')
          .then(reg => console.log('[sw] registered, scope', reg.scope))
          .catch(err => console.log('[sw] register failed', err && err.message));
      });
    }
  </script>
