<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Sake Tap — Cabaret Room</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <script src="./vendor/three/r128/three.min.js"></script>
  <script src="./vendor/three/r128/js/loaders/GLTFLoader.js"></script>
  <script src="./vendor/three/r128/js/utils/SkeletonUtils.js"></script>
  <script src="./vendor/three/r128/js/libs/meshopt_decoder.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff4df;
      --muted: #d4bea2;
      --gold: #ffc96a;
      --cyan: #65dfff;
      --red: #f15b4f;
      --green: #7de59c;
      --panel: rgba(13, 7, 4, .91);
      --line: rgba(255, 198, 111, .42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080402;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    #tavern-room,
    #game {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #tavern-room {
      z-index: 0;
      background: #080402;
    }

    #game {
      z-index: 1;
      background: transparent;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 14px;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(78px, 140px)) 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .meter,
    .phase,
    .badge,
    .icon-button,
    .control-button,
    .serve-button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .58), inset 0 1px rgba(255, 255, 255, .06);
      backdrop-filter: blur(8px);
    }

    .meter {
      min-height: 58px;
      display: grid;
      place-content: center;
      text-align: center;
      border-radius: 12px;
      padding: 7px 12px;
    }

    .meter span,
    .phase span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .meter b {
      color: var(--gold);
      font-size: 25px;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .phase {
      justify-self: end;
      min-height: 58px;
      min-width: 138px;
      display: grid;
      align-content: center;
      justify-items: end;
      border-radius: 12px;
      padding: 7px 14px;
    }

    .phase b { color: var(--cyan); font-size: 18px; }

    .icon-button {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 25px;
      font-weight: 950;
    }

    .brand {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      text-shadow: 0 4px 20px #000, 0 0 22px rgba(255, 169, 83, .36);
    }

    .brand strong {
      display: block;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(21px, 3vw, 38px);
      letter-spacing: .16em;
      line-height: 1;
      white-space: nowrap;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: rgba(255, 244, 223, .82);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .badge {
      position: fixed;
      right: 14px;
      top: 82px;
      padding: 6px 9px;
      border-color: rgba(255, 201, 106, .5);
      border-radius: 999px;
      color: #ffe1a1;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .player-orb {
      position: fixed;
      left: 14px;
      top: 82px;
      width: 62px;
      height: 62px;
      overflow: hidden;
      border: 2px solid #a96b3b;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #4d3223, #0b0503 72%);
      box-shadow: 0 8px 25px #000;
      pointer-events: none;
    }

    .player-orb img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 5px #000); }

    .announcement {
      align-self: center;
      justify-self: center;
      max-width: min(86vw, 680px);
      padding: 16px 24px;
      border: 2px solid rgba(255, 201, 106, .72);
      border-radius: 14px;
      background: rgba(8, 4, 2, .92);
      box-shadow: 0 18px 70px #000, 0 0 28px rgba(255, 169, 83, .19);
      text-align: center;
      opacity: 0;
      transform: translateY(10px) scale(.98);
      transition: opacity .18s ease, transform .18s ease;
    }

    .announcement.show { opacity: 1; transform: translateY(0) scale(1); }
    .announcement b { display: block; color: var(--gold); font: 950 clamp(24px, 5vw, 46px)/1 Georgia, serif; letter-spacing: .07em; }
    .announcement span { display: block; margin-top: 7px; color: var(--muted); font-size: 13px; font-weight: 800; }

    .bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .controls {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: end;
    }

    .control-button,
    .serve-button {
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      border-radius: 14px;
      font-weight: 950;
    }

    .control-button {
      width: 62px;
      height: 62px;
      font-size: 25px;
    }

    .serve-button {
      min-width: 150px;
      height: 72px;
      padding: 8px 20px;
      border: 2px solid #ff796d;
      background: linear-gradient(145deg, #bd4435, #7d1c12);
      color: #fff;
      font-size: 20px;
      letter-spacing: .04em;
    }

    .serve-button small { display: block; margin-top: 2px; font-size: 10px; letter-spacing: .13em; }

    .control-button:hover,
    .icon-button:hover { border-color: var(--cyan); }
    .serve-button:hover { filter: brightness(1.12); }
    .control-button:active,
    .serve-button:active,
    .icon-button:active { transform: translateY(1px) scale(.98); }

    button:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
      box-shadow: 0 0 0 5px #061014, 0 0 20px rgba(101, 223, 255, .72);
    }

    .instructions {
      pointer-events: none;
      max-width: min(48vw, 520px);
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: rgba(0, 0, 0, .78);
      color: #f4dfc4;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      text-shadow: 0 2px 4px #000;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px), (max-height: 650px) {
      .hud { padding: 7px; gap: 5px; }
      .topbar { grid-template-columns: repeat(4, minmax(54px, 1fr)) auto; gap: 4px; }
      .meter { min-height: 44px; border-radius: 8px; padding: 4px; }
      .meter span { font-size: 7px; letter-spacing: .06em; }
      .meter b { font-size: 18px; }
      .phase { position: fixed; right: 7px; top: 58px; min-height: 34px; min-width: 92px; padding: 4px 8px; border-radius: 8px; }
      .phase span { font-size: 7px; }
      .phase b { font-size: 12px; }
      .icon-button { width: 44px; height: 44px; border-radius: 9px; font-size: 19px; }
      .brand { top: 61px; }
      .brand strong { font-size: 18px; }
      .brand span, .badge, .player-orb { display: none; }
      .control-button { width: 48px; height: 48px; border-radius: 10px; font-size: 20px; }
      .serve-button { min-width: 108px; height: 56px; border-radius: 12px; padding: 5px 12px; font-size: 16px; }
      .instructions { max-width: 48vw; padding: 6px 8px; font-size: 9px; border-radius: 10px; }
      .announcement { padding: 12px 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .announcement { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="tavern-room" aria-hidden="true"></canvas>
  <canvas id="game" role="img" aria-label="Sake Tap inside the 3D sake tavern: three horizontal counters with monster customers"></canvas>

  <div class="hud">
    <div class="topbar" aria-label="Game score">
      <div class="meter"><span>Score</span><b id="score">0</b></div>
      <div class="meter"><span>High Score</span><b id="high-score">0</b></div>
      <div class="meter"><span>Gold Won</span><b id="gold">0</b></div>
      <div class="meter" aria-label="Time until the next 25 gold wage"><span>Next Wage</span><b id="wage-timer">3:00</b></div>
      <div class="phase"><span>Difficulty</span><b id="phase">Level 1 · 1×</b></div>
      <button class="icon-button" id="maximize" type="button" aria-label="Maximize Sake Tap">⛶</button>
    </div>

    <div class="brand" aria-hidden="true">
      <strong>酒 SAKE TAP</strong>
      <span>Work for wages · Play to pay</span>
    </div>
    <div class="player-orb" aria-label="Player 2 avatar is the bartender"><img src="./assets/games/sake-tap/sprites/bartender.png" alt=""></div>
    <div class="badge">Original Tapper room · Sake Tavern</div>

    <div class="announcement show" id="announcement" role="status" aria-live="polite">
      <b id="announcement-title">SAKE TAP</b>
      <span id="announcement-copy">Press Space or Serve to begin your shift</span>
    </div>

    <div class="bottom">
      <div class="controls" aria-label="Counter controls">
        <button class="control-button" id="move-up" type="button" aria-label="Move bartender up one counter">◀</button>
        <button class="control-button" id="move-down" type="button" aria-label="Move bartender down one counter">▶</button>
      </div>
      <div class="instructions">[Left] Up · [Right] Down · [Space] Serve · one mistake restarts the shift</div>
      <button class="serve-button" id="serve" type="button" aria-label="Serve a full sake drink">SERVE<small>FULL DRINK</small></button>
    </div>
  </div>

  <div class="sr-only" id="live-status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: true });
    const backdropCanvas = document.createElement('canvas');
    const backdropCtx = backdropCanvas.getContext('2d', { alpha: false });
    const tavernCanvas = document.getElementById('tavern-room');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPRITE_ROOT = './assets/games/sake-tap/sprites/';
    const TAVERN_MODEL_URL = './assets/models/rooms/SakeTavern.opt.glb';
    const CABARET_WALL_TEXTURE_URL = './assets/textures/Caberet-Wallpanels.png';
    const MONSTER_MODEL_SPECS = {
      goblin: {
        url: './assets/models/monster/goblin/new.goblin.glb',
        idle: 'NlaTrack.004', walk: 'NlaTrack.003', baseYaw: -Math.PI / 2
      },
      imp: {
        url: './assets/models/monster/imp/new.imp.glb',
        idle: 'NlaTrack.009', walk: 'NlaTrack.012', baseYaw: -Math.PI / 2
      },
      mummy: {
        url: './assets/models/monster/mummy/new-yakuza-mummy.glb',
        idle: 'NlaTrack.013', walk: 'NlaTrack.010', baseYaw: -Math.PI / 2
      },
      succubus: {
        url: './assets/models/monster/succubus/New-Succubus.fixed.glb',
        idle: 'Hip_Hop_Dance_4', walk: 'Walking', baseYaw: 0
      }
    };
    const IMAGE_SOURCES = {
      bartender: SPRITE_ROOT + 'bartender.png',
      bartenderWalk0: SPRITE_ROOT + 'bartender-walk-0.png',
      bartenderWalk1: SPRITE_ROOT + 'bartender-walk-1.png',
      bartenderWalk2: SPRITE_ROOT + 'bartender-walk-2.png',
      bartenderWalk3: SPRITE_ROOT + 'bartender-walk-3.png',
      bartenderWalk4: SPRITE_ROOT + 'bartender-walk-4.png',
      bartenderWalk5: SPRITE_ROOT + 'bartender-walk-5.png',
      bartenderWalk6: SPRITE_ROOT + 'bartender-walk-6.png',
      bartenderWalk7: SPRITE_ROOT + 'bartender-walk-7.png',
      sakeBottle: SPRITE_ROOT + 'sake-bottle-model.webp',
      counter: './assets/games/sake-tap/background/counter.png'
    };

    const CUSTOMER_TYPES = {
      goblin: { label: 'Goblin', drinks: 1, tint: '#b6edff' },
      imp: { label: 'Imp', drinks: 1, tint: '#ffc383' },
      mummy: { label: 'Mummy', drinks: 1, tint: '#fff0c7' },
      succubus: { label: 'Succubus', drinks: 5, bonus: 5, tint: '#d4b4ff' }
    };
    const GAME_SPEED_SCALE = .8;
    const CUSTOMER_PATIENCE_SCALE = 1.2;
    const MAX_LIVE_CUSTOMERS = 5;
    const WAGE_CYCLE_SECONDS = 180;
    const DIFFICULTY_PER_SECOND = .002;
    const BARTENDER_WALK_FRAME_COUNT = 8;
    const BARTENDER_WALK_FPS = 8;
    const BARTENDER_LANES_PER_SECOND = 2.35;
    const CUSTOMER_RENDER_HEIGHT_SCALE = .78;

    const el = {
      score: document.getElementById('score'),
      highScore: document.getElementById('high-score'),
      gold: document.getElementById('gold'),
      wageTimer: document.getElementById('wage-timer'),
      phase: document.getElementById('phase'),
      announcement: document.getElementById('announcement'),
      announcementTitle: document.getElementById('announcement-title'),
      announcementCopy: document.getElementById('announcement-copy'),
      live: document.getElementById('live-status')
    };

    const state = {
      width: innerWidth,
      height: innerHeight,
      dpr: 1,
      selectedLane: 1,
      targetLane: 1,
      playerLanePosition: 1,
      playerWalking: false,
      playerWalkTime: 0,
      playerWalkDirection: 0,
      score: 0,
      highScore: readHighScore(),
      goldWon: 0,
      phase: 1,
      phaseGoal: 6,
      phaseCompleted: 0,
      phaseElapsed: 0,
      elapsed: 0,
      wageCyclesPaid: 0,
      lastTimerSecond: -1,
      customers: [],
      drinks: [],
      empties: [],
      particles: [],
      sprites: {},
      tavern3d: null,
      tavernSceneReady: false,
      tavernTriangles: 0,
      monsterTemplates: {},
      monsterModelsReady: false,
      monsterTriangles: 0,
      running: false,
      resetting: false,
      paused: document.hidden,
      lastTime: performance.now(),
      spawnTimer: 8,
      animationId: 0,
      bannerTimer: 0,
      runId: `sake-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`
    };

    function readHighScore() {
      try { return Math.max(0, Number(localStorage.getItem('origamiSakeTapHighScore')) || 0); }
      catch (_) { return 0; }
    }

    function saveHighScore() {
      try { localStorage.setItem('origamiSakeTapHighScore', String(state.highScore)); }
      catch (_) {}
    }

    function postParent(message) {
      try {
        if (window.parent !== window) window.parent.postMessage(message, '*');
      } catch (_) {}
    }

    function reportAnomaly(subsystem, error, kind = 'SAKE_TAP_SPRITE') {
      postParent({
        type: 'ENGINE_ANOMALY',
        kind,
        subsystem,
        error: String(error?.message || error || 'unknown')
      });
    }

    function loadSprite(name, url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = 'async';
        image.onload = () => { state.sprites[name] = image; resolve(image); };
        image.onerror = () => reject(new Error(`Could not load ${url}`));
        image.src = url;
      });
    }

    function loadThreeTexture(url) {
      return new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(url, resolve, undefined, reject);
      });
    }

    function createOriginalTapperWoodTexture() {
      const textureCanvas = document.createElement('canvas');
      textureCanvas.width = textureCanvas.height = 512;
      const textureContext = textureCanvas.getContext('2d');
      textureContext.fillStyle = '#211107';
      textureContext.fillRect(0, 0, 512, 512);
      for (let grain = 0; grain < 120; grain++) {
        const y = grain * 4 + Math.random() * 3;
        textureContext.strokeStyle = `rgba(${70 + Math.random() * 50},${38 + Math.random() * 20},${16 + Math.random() * 14},${.25 + Math.random() * .32})`;
        textureContext.lineWidth = 1 + Math.random() * 3;
        textureContext.beginPath();
        textureContext.moveTo(0, y);
        textureContext.bezierCurveTo(140, y + Math.sin(grain) * 12, 340, y - Math.cos(grain) * 10, 512, y + Math.sin(grain * .4) * 8);
        textureContext.stroke();
      }
      for (let plank = 0; plank < 8; plank++) {
        textureContext.strokeStyle = 'rgba(0,0,0,.55)';
        textureContext.lineWidth = 3;
        textureContext.beginPath();
        textureContext.moveTo(0, plank * 64);
        textureContext.lineTo(512, plank * 64);
        textureContext.stroke();
      }
      const texture = new THREE.CanvasTexture(textureCanvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    async function buildCabaretRoomShell(tavernRoot) {
      tavernRoot.scale.setScalar(.55);
      tavernRoot.updateMatrixWorld(true);
      const initialBox = new THREE.Box3().setFromObject(tavernRoot);
      const initialCenter = initialBox.getCenter(new THREE.Vector3());
      tavernRoot.position.sub(initialCenter);
      tavernRoot.updateMatrixWorld(true);

      const furnishingBox = new THREE.Box3().setFromObject(tavernRoot);
      const furnishingSize = furnishingBox.getSize(new THREE.Vector3());
      const floorY = furnishingBox.min.y;
      const roomWidth = Math.max(furnishingSize.x * 1.72, furnishingSize.z * 1.28, 1);
      const roomDepth = Math.max(furnishingSize.z * 1.88, furnishingSize.x * .82, 1);
      const originalWallHeight = Math.max(furnishingSize.y * 1.28, roomDepth * .58, 1);
      const wallHeight = originalWallHeight * .6;
      tavernRoot.position.x -= roomWidth * .26;
      tavernRoot.position.z -= roomDepth * .14;
      tavernRoot.updateMatrixWorld(true);

      const [{ createDarkWoodRafterTexture }, wallTexture] = await Promise.all([
        import('./js/v8/map/ProceduralTextures.js'),
        loadThreeTexture(CABARET_WALL_TEXTURE_URL)
      ]);

      const floorTexture = createOriginalTapperWoodTexture();
      floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
      floorTexture.repeat.set(2, Math.max(3, Math.round(3 * roomDepth / roomWidth)));
      floorTexture.generateMipmaps = false;
      floorTexture.minFilter = THREE.LinearFilter;
      floorTexture.magFilter = THREE.LinearFilter;
      floorTexture.anisotropy = 4;
      const floorMaterial = new THREE.MeshStandardMaterial({
        map: floorTexture,
        color: 0x563018,
        roughness: .86,
        metalness: .02,
        emissive: 0x120704,
        emissiveIntensity: .2
      });

      const ceilingTexture = createDarkWoodRafterTexture();
      ceilingTexture.wrapS = ceilingTexture.wrapT = THREE.RepeatWrapping;
      ceilingTexture.repeat.set(4, Math.max(3, Math.round(4 * roomDepth / roomWidth)));
      ceilingTexture.generateMipmaps = false;
      ceilingTexture.minFilter = THREE.LinearFilter;
      ceilingTexture.magFilter = THREE.LinearFilter;
      ceilingTexture.anisotropy = 4;
      const ceilingMaterial = new THREE.MeshStandardMaterial({
        map: ceilingTexture,
        color: 0x171410,
        roughness: 1,
        metalness: 0,
        side: THREE.FrontSide
      });

      wallTexture.wrapS = wallTexture.wrapT = THREE.RepeatWrapping;
      wallTexture.encoding = THREE.sRGBEncoding;
      wallTexture.generateMipmaps = false;
      wallTexture.minFilter = THREE.LinearFilter;
      wallTexture.magFilter = THREE.LinearFilter;
      wallTexture.anisotropy = 4;
      // Use half the former repeat count so the carved cabaret panels retain
      // their original proportions instead of compressing across the room.
      const panelWorldWidth = (roomWidth / 6) * 3;
      const makeWallMaterial = (span) => {
        const texture = wallTexture.clone();
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(Math.max(1, span / panelWorldWidth), .6);
        texture.offset.y = .2;
        texture.needsUpdate = true;
        return new THREE.MeshStandardMaterial({
          map: texture,
          color: 0xbfbfbf,
          roughness: .92,
          metalness: 0,
          side: THREE.DoubleSide
        });
      };

      const shell = new THREE.Group();
      shell.name = 'TapperCabaretDungeonShell';
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMaterial);
      floor.name = 'CabaretDungeonFloor';
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, floorY - .002, 0);
      floor.receiveShadow = true;
      shell.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilingMaterial);
      ceiling.name = 'CabaretDarkCeiling';
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(0, floorY + originalWallHeight, 0);
      ceiling.receiveShadow = true;
      shell.add(ceiling);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, wallHeight), makeWallMaterial(roomWidth));
      backWall.name = 'CabaretBackWall';
      backWall.position.set(0, floorY + wallHeight / 2, -roomDepth / 2);
      backWall.receiveShadow = true;
      shell.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), makeWallMaterial(roomDepth));
      leftWall.name = 'CabaretLeftWall';
      leftWall.position.set(-roomWidth / 2, floorY + wallHeight / 2, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.receiveShadow = true;
      shell.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(roomDepth, wallHeight), makeWallMaterial(roomDepth));
      rightWall.name = 'CabaretRightWall';
      rightWall.position.set(roomWidth / 2, floorY + wallHeight / 2, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.receiveShadow = true;
      shell.add(rightWall);

      const room = new THREE.Group();
      room.name = 'SakeTapCabaretRoom';
      room.add(shell, tavernRoot);
      room.updateMatrixWorld(true);
      const roomBox = new THREE.Box3().setFromObject(room);
      return {
        room,
        bounds: roomBox.getSize(new THREE.Vector3()),
        roomCenter: roomBox.getCenter(new THREE.Vector3()),
        floorY,
        wallHeight,
        roomDepth
      };
    }

    function configureTavernViewport() {
      if (!state.tavern3d) return;
      const { renderer, camera, actorCamera, bounds, homePosition, lookTarget, roomCenter, floorY, wallHeight, roomDepth } = state.tavern3d;
      const aspect = state.width / state.height;
      const elevation = THREE.MathUtils.degToRad(50);
      const distance = Math.max(bounds.x, bounds.y, bounds.z, 1) * 2.4;
      const projectedHeight = bounds.z * Math.sin(elevation) + bounds.y * Math.cos(elevation);
      const viewHeight = Math.max(projectedHeight, bounds.x / Math.max(.1, aspect)) * 1.08;

      renderer.setPixelRatio(Math.min(state.dpr, 1.35));
      renderer.setSize(state.width, state.height, false);
      lookTarget.set(roomCenter.x, floorY + wallHeight * .18, roomCenter.z - roomDepth * .06);
      homePosition.set(
        lookTarget.x,
        lookTarget.y + distance * Math.sin(elevation),
        lookTarget.z + distance * Math.cos(elevation)
      );
      camera.position.copy(homePosition);
      camera.lookAt(lookTarget);
      camera.left = -viewHeight * aspect * .5;
      camera.right = viewHeight * aspect * .5;
      camera.top = viewHeight * .5;
      camera.bottom = -viewHeight * .5;
      camera.near = .01;
      camera.far = distance * 4;
      camera.updateProjectionMatrix();
      actorCamera.left = -state.width * .5;
      actorCamera.right = state.width * .5;
      actorCamera.top = state.height * .5;
      actorCamera.bottom = -state.height * .5;
      actorCamera.updateProjectionMatrix();
    }

    function setCustomerAction(customer, mode, fadeSeconds = .22) {
      const actor = customer.model3d;
      if (!actor || actor.mode === mode) return;
      const next = mode === 'walk' ? actor.walkAction : actor.idleAction;
      const previous = actor.mode === 'walk' ? actor.walkAction : actor.idleAction;
      if (!next || next === previous) {
        actor.mode = mode;
        return;
      }
      next.enabled = true;
      next.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(fadeSeconds).play();
      if (previous) previous.fadeOut(fadeSeconds);
      actor.mode = mode;
    }

    function attachCustomerModel(customer) {
      const template = state.monsterTemplates[customer.type];
      const actorScene = state.tavern3d?.actorScene;
      if (!template || !actorScene || customer.model3d) return;
      const model = THREE.SkeletonUtils.clone(template.scene);
      const wrapper = new THREE.Group();
      wrapper.add(model);

      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.set(-center.x, -box.min.y, -center.z);
      model.updateMatrixWorld(true);
      const groundedBox = new THREE.Box3().setFromObject(model);
      const modelHeight = Math.max(.001, groundedBox.getSize(new THREE.Vector3()).y);

      const mixer = new THREE.AnimationMixer(model);
      const idleClip = THREE.AnimationClip.findByName(template.animations, template.spec.idle) || template.animations[0];
      const walkClip = THREE.AnimationClip.findByName(template.animations, template.spec.walk) || idleClip;
      const idleAction = idleClip ? mixer.clipAction(idleClip) : null;
      const walkAction = walkClip ? mixer.clipAction(walkClip) : idleAction;
      if (idleAction) {
        idleAction.setLoop(THREE.LoopRepeat, Infinity).play();
        idleAction.time = Math.random() * Math.max(.01, idleClip.duration);
      }
      wrapper.rotation.y = template.spec.baseYaw + (customer.facing < 0 ? Math.PI : 0);
      actorScene.add(wrapper);
      customer.model3d = {
        wrapper,
        mixer,
        idleAction,
        walkAction,
        mode: 'idle',
        modelHeight,
        yaw: wrapper.rotation.y,
        spec: template.spec
      };
    }

    function detachCustomerModel(customer) {
      if (!customer?.model3d) return;
      state.tavern3d?.actorScene.remove(customer.model3d.wrapper);
      customer.model3d.mixer.stopAllAction();
      customer.model3d = null;
    }

    function clearCustomerModels() {
      state.customers.forEach(detachCustomerModel);
    }

    function updateCustomerModels(dt) {
      const L = layout();
      for (const customer of state.customers) {
        if (!customer.model3d) attachCustomerModel(customer);
        const actor = customer.model3d;
        if (!actor) continue;
        const walking = customer.leaving || customer.x > customer.targetX + 2;
        setCustomerAction(customer, walking ? 'walk' : 'idle');
        actor.mixer.timeScale = reduceMotion ? 0 : customer.animationRate;
        actor.mixer.update(dt);

        const desiredFacing = customer.leaving
          ? -1
          : (customer.turnProgress < 1 ? customer.turnTargetFacing : customer.facing);
        const desiredYaw = actor.spec.baseYaw + (desiredFacing < 0 ? Math.PI : 0);
        const yawDelta = Math.atan2(Math.sin(desiredYaw - actor.yaw), Math.cos(desiredYaw - actor.yaw));
        actor.yaw += yawDelta * Math.min(1, dt * 4.5);
        actor.wrapper.rotation.y = actor.yaw;

        const groundY = L.laneY[customer.lane] + Math.max(10, L.spriteHeight * .09);
        const customerHeight = L.spriteHeight * CUSTOMER_RENDER_HEIGHT_SCALE;
        const actorCamera = state.tavern3d.actorCamera;
        const cameraLength = Math.hypot(actorCamera.position.y, actorCamera.position.z);
        const verticalProjection = actorCamera.position.z / cameraLength;
        const scale = customerHeight / (actor.modelHeight * verticalProjection);
        const screenGroundY = state.height * .5 - groundY;
        const groundDepth = -screenGroundY * cameraLength / actorCamera.position.y;
        actor.wrapper.scale.setScalar(scale);
        actor.wrapper.position.set(customer.x - state.width * .5, 0, groundDepth);
        actor.wrapper.visible = customer.x > -L.spriteHeight && customer.x < state.width + L.spriteHeight;
      }
    }

    function renderTavernFrame(time) {
      if (!state.tavern3d || state.tavern3d.renderFaulted) return;
      const { renderer, scene, camera, actorScene, actorCamera, bounds, homePosition, lookTarget, key, fill, hearth } = state.tavern3d;
      const laneLift = (1 - state.playerLanePosition) * bounds.y * .018;
      const driftX = reduceMotion ? 0 : Math.sin(time * .19) * bounds.x * .007;
      const driftY = reduceMotion ? 0 : Math.sin(time * .31) * bounds.y * .004;
      camera.position.set(homePosition.x + driftX, homePosition.y + laneLift + driftY, homePosition.z);
      camera.lookAt(lookTarget.x + driftX * .22, lookTarget.y + laneLift * .22, lookTarget.z);
      if (!reduceMotion) {
        hearth.intensity = .532 + Math.sin(time * 4.2) * .042 + Math.sin(time * 7.9) * .021;
        key.intensity = 1.036 + Math.sin(time * .53) * .035;
        fill.intensity = .238 + Math.sin(time * .37 + 1.7) * .018;
      }
      try {
        renderer.render(scene, camera);
        renderer.autoClear = false;
        renderer.clearDepth();
        renderer.render(actorScene, actorCamera);
        renderer.autoClear = true;
      } catch (error) {
        renderer.autoClear = true;
        state.tavern3d.renderFaulted = true;
        state.tavernSceneReady = false;
        tavernCanvas.style.visibility = 'hidden';
        reportAnomaly('tavern-live-render', error, 'SAKE_TAP_SCENE');
      }
    }

    async function loadTavernScene() {
      if (!window.THREE?.GLTFLoader) throw new Error('Three.js GLTFLoader is unavailable');
      const renderer = new THREE.WebGLRenderer({
        canvas: tavernCanvas,
        alpha: false,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setClearColor(0x100503, 1);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = .82;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x100503);
      scene.fog = new THREE.FogExp2(0x100503, .018);
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .01, 200);
      scene.add(new THREE.HemisphereLight(0xffddb8, 0x160806, .644));
      const key = new THREE.DirectionalLight(0xffbd72, 1.05);
      key.position.set(-5, 9, 8);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.bias = -.00035;
      key.shadow.normalBias = .025;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x88cfff, .238);
      fill.position.set(7, 5, -4);
      scene.add(fill);
      const hearth = new THREE.PointLight(0xff6b32, .546, 24, 2);
      hearth.position.set(-2, 3.4, 3.5);
      scene.add(hearth);

      const actorScene = new THREE.Scene();
      const actorCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 3000);
      actorCamera.position.set(0, 1192, 1000);
      actorCamera.lookAt(0, 0, 0);
      actorScene.add(new THREE.HemisphereLight(0xffe2c2, 0x160b1d, 1.08));
      const actorKey = new THREE.DirectionalLight(0xffc887, 1.18);
      actorKey.position.set(-4, 8, 7);
      actorScene.add(actorKey);
      const actorFill = new THREE.DirectionalLight(0x8ccfff, .32);
      actorFill.position.set(7, 3, 5);
      actorScene.add(actorFill);

      const loader = new THREE.GLTFLoader();
      if (window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
      const gltf = await new Promise((resolve, reject) => loader.load(TAVERN_MODEL_URL, resolve, undefined, reject));
      const root = gltf.scene;
      let triangles = 0;
      root.rotation.y = -Math.PI / 2;
      root.traverse(node => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        node.frustumCulled = true;
        const geometryCount = node.geometry?.index?.count || node.geometry?.attributes?.position?.count || 0;
        triangles += Math.floor(geometryCount / 3);
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach(material => {
          if (!material) return;
          material.roughness = Math.max(.42, material.roughness ?? .7);
          material.needsUpdate = true;
        });
      });
      const cabaretRoom = await buildCabaretRoomShell(root);
      scene.add(cabaretRoom.room);
      const shadowSpan = Math.max(cabaretRoom.bounds.x, cabaretRoom.bounds.z) * .62;
      key.position.set(
        cabaretRoom.roomCenter.x - cabaretRoom.bounds.x * .45,
        cabaretRoom.floorY + cabaretRoom.wallHeight * 1.3,
        cabaretRoom.roomCenter.z + cabaretRoom.roomDepth * .65
      );
      key.shadow.camera.left = -shadowSpan;
      key.shadow.camera.right = shadowSpan;
      key.shadow.camera.top = shadowSpan;
      key.shadow.camera.bottom = -shadowSpan;
      key.shadow.camera.near = .05;
      key.shadow.camera.far = Math.max(20, cabaretRoom.bounds.y * 4);
      key.shadow.camera.updateProjectionMatrix();
      key.target.position.copy(cabaretRoom.roomCenter);
      scene.add(key.target);
      triangles += 8;

      state.tavernTriangles = triangles;
      state.tavern3d = {
        renderer,
        scene,
        camera,
        actorScene,
        actorCamera,
        root: cabaretRoom.room,
        bounds: cabaretRoom.bounds,
        roomCenter: cabaretRoom.roomCenter,
        floorY: cabaretRoom.floorY,
        wallHeight: cabaretRoom.wallHeight,
        roomDepth: cabaretRoom.roomDepth,
        key,
        fill,
        hearth,
        renderFaulted: false,
        homePosition: new THREE.Vector3(),
        lookTarget: new THREE.Vector3()
      };
      configureTavernViewport();
      state.tavernSceneReady = true;
    }

    async function loadMonsterTemplates() {
      if (!window.THREE?.GLTFLoader || !window.THREE?.SkeletonUtils) {
        throw new Error('Three.js animated-model support is unavailable');
      }
      const loader = new THREE.GLTFLoader();
      if (window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
      const entries = await Promise.all(Object.entries(MONSTER_MODEL_SPECS).map(async ([type, spec]) => {
        const gltf = await new Promise((resolve, reject) => loader.load(spec.url, resolve, undefined, reject));
        let triangles = 0;
        let rootTiltTracksRemoved = 0;
        gltf.scene.traverse(node => {
          if (!node.isMesh) return;
          node.frustumCulled = false;
          const geometryCount = node.geometry?.index?.count || node.geometry?.attributes?.position?.count || 0;
          triangles += Math.floor(geometryCount / 3);
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach(material => {
            if (!material) return;
            if (material.map) material.map.encoding = THREE.sRGBEncoding;
            if ('metalness' in material) material.metalness = Math.min(.12, material.metalness ?? 0);
            if ('roughness' in material) material.roughness = Math.max(.72, material.roughness ?? .72);
            material.needsUpdate = true;
          });
        });
        const animations = gltf.animations.map(clip => {
          if (type === 'succubus') return clip;
          const uprightTracks = clip.tracks.filter(track => {
            const isRootTilt = /(^|[/.:])Root\.quaternion$/.test(track.name);
            if (isRootTilt) rootTiltTracksRemoved += 1;
            return !isRootTilt;
          });
          return new THREE.AnimationClip(clip.name, clip.duration, uprightTracks);
        });
        return [type, { scene: gltf.scene, animations, spec, triangles, rootTiltTracksRemoved }];
      }));
      state.monsterTemplates = Object.fromEntries(entries);
      state.monsterTriangles = entries.reduce((sum, [, template]) => sum + template.triangles, 0);
      state.monsterModelsReady = true;
    }

    function resize() {
      state.width = Math.max(320, innerWidth);
      state.height = Math.max(320, innerHeight);
      state.dpr = Math.min(devicePixelRatio || 1, 1.75);
      canvas.width = Math.round(state.width * state.dpr);
      canvas.height = Math.round(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      backdropCanvas.width = state.width;
      backdropCanvas.height = state.height;
      buildTavernBackdrop();
      configureTavernViewport();
      keepActorsInBounds();
    }

    function layout() {
      const compact = state.width < 760 || state.height < 650;
      const top = compact ? 124 : 160;
      const bottom = compact ? 70 : 96;
      const usable = Math.max(220, state.height - top - bottom);
      const gap = usable / 3;
      const counterStart = Math.max(compact ? 92 : 150, state.width * (compact ? .20 : .18));
      const counterEnd = state.width - 18;
      const spriteHeight = Math.max(compact ? 76 : 104, Math.min(compact ? 112 : 144, gap * .84));
      return {
        compact,
        counterStart,
        counterEnd,
        serviceX: counterStart + Math.max(62, spriteHeight * .56),
        catchX: counterStart + 12,
        spriteHeight,
        laneY: [top + gap * .72, top + gap * 1.72, top + gap * 2.72]
      };
    }

    function keepActorsInBounds() {
      const L = layout();
      state.customers.forEach(customer => {
        if (!Number.isFinite(customer.x)) customer.x = L.counterEnd - 20;
        customer.x = Math.min(customer.x, state.width + L.spriteHeight);
      });
    }

    function showBanner(title, copy, duration = 1400) {
      el.announcementTitle.textContent = title;
      el.announcementCopy.textContent = copy;
      el.announcement.classList.add('show');
      el.live.textContent = `${title}. ${copy}`;
      clearTimeout(state.bannerTimer);
      if (duration > 0) state.bannerTimer = setTimeout(() => el.announcement.classList.remove('show'), duration);
    }

    function difficultyScale() {
      return state.phase * (1 + state.phaseElapsed * DIFFICULTY_PER_SECOND);
    }

    function liveCustomerLimit() {
      return Math.min(10, MAX_LIVE_CUSTOMERS + Math.floor((state.phase - 1) / 2));
    }

    function passSpeedScale() {
      return GAME_SPEED_SCALE * difficultyScale();
    }

    function formatClock(seconds) {
      const whole = Math.max(0, Math.ceil(seconds));
      return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
    }

    function updateTimerHud(force = false) {
      const elapsedSecond = Math.floor(state.elapsed);
      if (!force && elapsedSecond === state.lastTimerSecond) return;
      state.lastTimerSecond = elapsedSecond;
      const cycleElapsed = state.elapsed % WAGE_CYCLE_SECONDS;
      const remaining = cycleElapsed === 0 && state.elapsed > 0 ? WAGE_CYCLE_SECONDS : WAGE_CYCLE_SECONDS - cycleElapsed;
      el.wageTimer.textContent = formatClock(remaining);
      el.wageTimer.setAttribute('aria-label', `${formatClock(remaining)} until the next 25 gold wage`);
    }

    function updateWageClock(dt) {
      state.elapsed += dt;
      state.phaseElapsed += dt;
      const completedCycles = Math.floor(state.elapsed / WAGE_CYCLE_SECONDS);
      if (completedCycles > state.wageCyclesPaid) {
        const cyclesEarned = completedCycles - state.wageCyclesPaid;
        const wage = cyclesEarned * 25;
        state.wageCyclesPaid = completedCycles;
        state.goldWon += wage;
        showBanner(`${wage} GOLD WAGE`, `${cyclesEarned * 3} peaceful minutes completed`, 1800);
        postParent({
          type: 'TAPPER_PAYOUT',
          amount: wage,
          elapsedSeconds: Math.floor(state.elapsed),
          wageCycles: cyclesEarned,
          runId: state.runId,
          source: 'sake-tap-wage'
        });
        el.live.textContent = `${wage} gold wage earned for ${cyclesEarned * 3} peaceful minutes.`;
        updateHud();
      }
      updateTimerHud();
    }

    function updateHud() {
      el.score.textContent = String(state.score);
      el.highScore.textContent = String(state.highScore);
      el.gold.textContent = String(state.goldWon);
      el.phase.textContent = `Level ${state.phase} · ${state.phase}×`;
      updateTimerHud(true);
    }

    function addScore(points, reason) {
      const beforeMilestone = Math.floor(state.score / 100);
      state.score += points;
      if (state.score > state.highScore) {
        state.highScore = state.score;
        saveHighScore();
      }
      const afterMilestone = Math.floor(state.score / 100);
      if (afterMilestone > beforeMilestone) {
        state.goldWon += 25;
        showBanner('25 GOLD WON', '100 peaceful service points', 1600);
        postParent({ type: 'TAPPER_PAYOUT', amount: 25, score: state.score, runId: state.runId, source: 'sake-tap-score' });
      }
      postParent({ type: 'TAPPER_SCORE', points, score: state.score, reason });
      updateHud();
    }

    function makeCustomer(type, lane, x) {
      const definition = CUSTOMER_TYPES[type];
      const facing = Math.random() < .5 ? -1 : 1;
      const customer = {
        id: `${type}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        type,
        label: definition.label,
        lane,
        x,
        targetX: x,
        drinksRemaining: definition.drinks,
        drinking: false,
        drinkTimer: 0,
        drinkDuration: 0,
        leaving: false,
        wait: 0,
        phaseCredit: false,
        bobSeed: Math.random() * Math.PI * 2,
        facing,
        turnFromFacing: facing,
        turnTargetFacing: facing,
        turnProgress: 1,
        turnTimer: 1.25 + Math.random() * 3.75,
        animationRate: .86 + Math.random() * .28
      };
      attachCustomerModel(customer);
      return customer;
    }

    function seedPreview() {
      clearCustomerModels();
      const L = layout();
      const spacing = L.spriteHeight * .55;
      const counterSpan = L.counterEnd - L.counterStart;
      const openingFrontX = Math.min(
        L.counterEnd - spacing * 1.2,
        L.counterStart + counterSpan * .7
      );
      state.customers = [
        makeCustomer('goblin', 0, openingFrontX),
        makeCustomer('mummy', 1, openingFrontX + spacing * .12),
        makeCustomer('imp', 2, openingFrontX + spacing * .08)
      ];
      state.spawnTimer = 8;
    }

    function queueTarget(customer) {
      const L = layout();
      const queue = state.customers
        .filter(other => other.lane === customer.lane && !other.leaving)
        .sort((a, b) => a.x - b.x);
      const index = Math.max(0, queue.indexOf(customer));
      return L.serviceX + index * L.spriteHeight * .56;
    }

    function spawnCustomer(preferredType) {
      const L = layout();
      const pressure = difficultyScale();
      const laneLoads = [0, 1, 2].map(lane => state.customers.filter(c => c.lane === lane && !c.leaving).length);
      const minimum = Math.min(...laneLoads);
      const openLanes = laneLoads.map((load, lane) => load === minimum ? lane : -1).filter(lane => lane >= 0);
      const lane = openLanes[Math.floor(Math.random() * openLanes.length)];
      const types = ['goblin', 'imp', 'mummy', 'goblin', 'imp', 'succubus'];
      const type = preferredType || types[Math.floor(Math.random() * types.length)];
      state.customers.push(makeCustomer(type, lane, state.width + L.spriteHeight * .55));
      state.spawnTimer = Math.max(.85, 8.2 / pressure) + Math.random() * Math.max(.35, 2.4 / pressure);
    }

    function startGame() {
      if (state.resetting) return;
      if (!state.running) {
        state.running = true;
        el.announcement.classList.remove('show');
        el.live.textContent = 'Shift started.';
      }
    }

    function setLane(lane) {
      const destination = Math.max(0, Math.min(2, lane));
      state.targetLane = destination;
      startGame();
      if (Math.abs(state.targetLane - state.playerLanePosition) < .001) {
        state.selectedLane = destination;
        state.playerWalking = false;
        state.playerWalkDirection = 0;
        el.live.textContent = `Bartender at counter ${destination + 1}.`;
      } else {
        state.playerWalking = true;
        state.playerWalkDirection = Math.sign(state.targetLane - state.playerLanePosition);
        el.live.textContent = `Walking to counter ${destination + 1}.`;
      }
    }

    function moveLane(delta) { setLane(state.targetLane + delta); }

    function serve() {
      if (state.resetting) return;
      startGame();
      if (state.playerWalking) {
        el.live.textContent = `Reach counter ${state.targetLane + 1} before serving.`;
        return;
      }
      const L = layout();
      state.drinks.push({ lane: state.selectedLane, x: L.catchX + 10, speed: Math.max(250, state.width * .36) * passSpeedScale() });
      burst(L.catchX + 18, L.laneY[state.selectedLane] - 6, '#ffe8bb', 5);
    }

    function mistake(reason) {
      if (state.resetting) return;
      state.resetting = true;
      state.running = false;
      postParent({ type: 'TAPPER_MISTAKE', reason, score: state.score, highScore: state.highScore, elapsedSeconds: Math.floor(state.elapsed) });
      showBanner('SHIFT RESTARTED', `${reason} · score resets and the wage timer restarts`, 0);
      setTimeout(() => {
        state.score = 0;
        state.phase = 1;
        state.phaseGoal = 6;
        state.phaseCompleted = 0;
        state.phaseElapsed = 0;
        state.elapsed = 0;
        state.wageCyclesPaid = 0;
        state.lastTimerSecond = -1;
        state.selectedLane = 1;
        state.targetLane = 1;
        state.playerLanePosition = 1;
        state.playerWalking = false;
        state.playerWalkTime = 0;
        state.playerWalkDirection = 0;
        state.drinks = [];
        state.empties = [];
        state.particles = [];
        seedPreview();
        state.resetting = false;
        updateHud();
        showBanner('SAKE TAP', 'Press Space or Serve to begin your shift', 0);
      }, 1250);
    }

    function completeCustomer(customer) {
      if (customer.phaseCredit) return;
      customer.phaseCredit = true;
      customer.leaving = true;
      state.phaseCompleted += 1;
      const definition = CUSTOMER_TYPES[customer.type];
      if (definition.bonus) {
        addScore(definition.bonus, 'succubus-five-drinks');
        showBanner('SUCCUBUS SERVED', 'Five drinks · +5 bonus points', 1200);
      }
      if (state.phaseCompleted >= state.phaseGoal) completePhase();
    }

    function completePhase() {
      const completedLevel = state.phase;
      state.phaseCompleted = 0;
      state.phaseElapsed = 0;
      state.goldWon += 5;
      postParent({ type: 'TAPPER_PAYOUT', amount: 5, phase: completedLevel, difficultyLevel: completedLevel, runId: state.runId, source: 'sake-tap-level' });
      showBanner(`LEVEL ${completedLevel} COMPLETE`, `+5 gold · level ${completedLevel + 1} runs at ${completedLevel + 1}× speed`, 1700);
      state.phase += 1;
      state.phaseGoal = 5 + state.phase;
      updateHud();
    }

    function burst(x, y, color, count = 9) {
      for (let i = 0; i < count; i++) {
        state.particles.push({
          x,
          y,
          vx: (Math.random() - .5) * 58,
          vy: -22 - Math.random() * 52,
          life: .45 + Math.random() * .35,
          age: 0,
          color
        });
      }
    }

    function randomDrinkDuration(type) {
      const ranges = {
        goblin: [1.05, 2.05],
        imp: [.85, 1.75],
        mummy: [1.55, 2.85],
        succubus: [1.15, 2.55]
      };
      const [minimum, maximum] = ranges[type] || [1, 2.4];
      return minimum + Math.random() * (maximum - minimum);
    }

    function beginCustomerDrink(customer) {
      customer.drinking = true;
      customer.drinkDuration = randomDrinkDuration(customer.type) / difficultyScale();
      customer.drinkTimer = customer.drinkDuration;
      customer.wait = 0;
      el.live.textContent = `${customer.label} is drinking.`;
    }

    function finishCustomerDrink(customer, L) {
      customer.drinking = false;
      customer.drinkTimer = 0;
      customer.drinksRemaining -= 1;
      addScore(5, `${customer.type}-drink`);
      burst(customer.x, L.laneY[customer.lane] - L.spriteHeight * .56, CUSTOMER_TYPES[customer.type].tint, 10);
      state.empties.push({ lane: customer.lane, x: customer.x, speed: Math.max(210, state.width * .31) * passSpeedScale() });
      el.live.textContent = `${customer.label} finished a drink. Catch the empty cup.`;
      if (customer.drinksRemaining <= 0) completeCustomer(customer);
      else customer.x += L.spriteHeight * .36;
    }

    function updateBartenderMovement(dt) {
      if (state.resetting) return;
      const distance = state.targetLane - state.playerLanePosition;
      if (Math.abs(distance) < .001) {
        state.playerLanePosition = state.targetLane;
        state.selectedLane = state.targetLane;
        if (state.playerWalking) {
          state.playerWalking = false;
          state.playerWalkDirection = 0;
          el.live.textContent = `Bartender arrived at counter ${state.selectedLane + 1}.`;
        }
        return;
      }

      state.playerWalking = true;
      state.playerWalkDirection = Math.sign(distance);
      state.playerWalkTime += dt;
      const step = BARTENDER_LANES_PER_SECOND * dt;
      if (Math.abs(distance) <= step) {
        state.playerLanePosition = state.targetLane;
        state.selectedLane = state.targetLane;
        state.playerWalking = false;
        state.playerWalkDirection = 0;
        el.live.textContent = `Bartender arrived at counter ${state.selectedLane + 1}.`;
      } else {
        state.playerLanePosition += state.playerWalkDirection * step;
        state.selectedLane = Math.round(state.playerLanePosition);
      }
    }

    function update(dt) {
      if (!reduceMotion) {
        for (const customer of state.customers) {
          if (customer.turnProgress < 1) {
            customer.turnProgress = Math.min(1, customer.turnProgress + dt * 3.6);
            if (customer.turnProgress >= 1) customer.facing = customer.turnTargetFacing;
          }
          if (customer.leaving || customer.drinking) continue;
          customer.turnTimer -= dt;
          if (customer.turnTimer <= 0) {
            customer.turnFromFacing = customer.facing;
            customer.turnTargetFacing = -customer.facing;
            customer.turnProgress = 0;
            customer.turnTimer = 1.35 + Math.random() * 4.4;
          }
        }
      }
      if (!state.running || state.resetting) return;
      updateBartenderMovement(dt);
      const L = layout();
      updateWageClock(dt);
      const pressure = difficultyScale();
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0 && state.customers.filter(c => !c.leaving).length < liveCustomerLimit()) spawnCustomer();

      for (const customer of state.customers) {
        if (customer.leaving) {
          customer.x += Math.max(92, state.width * .15) * dt;
          continue;
        }
        if (customer.drinking) {
          customer.wait = 0;
          customer.drinkTimer -= dt;
          if (customer.drinkTimer <= 0) finishCustomerDrink(customer, L);
          continue;
        }
        customer.targetX = queueTarget(customer);
        if (customer.x > customer.targetX + 2) {
          const approach = Math.max(16, state.width * (.018 + state.phase * .0005)) * GAME_SPEED_SCALE * pressure;
          customer.x = Math.max(customer.targetX, customer.x - approach * dt);
          customer.wait = 0;
        } else if (customer.targetX <= L.serviceX + 2) {
          customer.wait += dt;
          if (customer.wait > Math.max(8, 13 - state.phase * .15) * CUSTOMER_PATIENCE_SCALE / pressure) {
            mistake(`${customer.label} waited too long`);
            return;
          }
        }
      }
      const remainingCustomers = [];
      for (const customer of state.customers) {
        if (customer.x < state.width + L.spriteHeight * .8) remainingCustomers.push(customer);
        else detachCustomerModel(customer);
      }
      state.customers = remainingCustomers;

      for (let i = state.drinks.length - 1; i >= 0; i--) {
        const drink = state.drinks[i];
        drink.x += drink.speed * dt;
        const targets = state.customers
          .filter(c => c.lane === drink.lane && !c.leaving && !c.drinking && c.x >= drink.x - 22)
          .sort((a, b) => a.x - b.x);
        const hit = targets[0];
        if (hit && Math.abs(hit.x - drink.x) < Math.max(30, L.spriteHeight * .24)) {
          state.drinks.splice(i, 1);
          beginCustomerDrink(hit);
        } else if (drink.x > L.counterEnd + 18) {
          state.drinks.splice(i, 1);
          mistake('A full drink slid off an empty counter');
          return;
        }
      }

      for (let i = state.empties.length - 1; i >= 0; i--) {
        const empty = state.empties[i];
        empty.x -= empty.speed * dt;
        if (empty.x <= L.catchX) {
          state.empties.splice(i, 1);
          if (empty.lane !== state.selectedLane) {
            mistake('An empty cup was not caught');
            return;
          }
          burst(L.catchX, L.laneY[empty.lane] - 8, '#75d08f', 6);
          el.live.textContent = `Caught the empty cup at counter ${empty.lane + 1}.`;
        }
      }

      for (const particle of state.particles) {
        particle.age += dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 125 * dt;
      }
      state.particles = state.particles.filter(particle => particle.age < particle.life);
    }

    function roundedRect(x, y, width, height, radius) {
      const r = Math.min(radius, width * .5, height * .5);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function buildTavernBackdrop() {
      const L = layout();
      const b = backdropCtx;
      const wallTop = L.compact ? 86 : 112;
      const base = b.createLinearGradient(0, 0, 0, state.height);
      base.addColorStop(0, '#090403');
      base.addColorStop(.2, '#160b08');
      base.addColorStop(.62, '#20110c');
      base.addColorStop(1, '#080302');
      b.fillStyle = base;
      b.fillRect(0, 0, state.width, state.height);

      const plaster = b.createRadialGradient(state.width * .58, state.height * .43, 18, state.width * .58, state.height * .43, state.width * .62);
      plaster.addColorStop(0, 'rgba(116,61,39,.18)');
      plaster.addColorStop(.42, 'rgba(66,32,23,.12)');
      plaster.addColorStop(1, 'rgba(5,2,1,0)');
      b.fillStyle = plaster;
      b.fillRect(0, wallTop, state.width, state.height - wallTop);

      for (let stripe = 0; stripe < 26; stripe++) {
        const x = (stripe * 173 + 61) % Math.max(1, state.width);
        const width = 18 + (stripe * 29) % 66;
        const shade = stripe % 3 === 0 ? 'rgba(255,190,135,.013)' : 'rgba(0,0,0,.035)';
        const texture = b.createLinearGradient(x, 0, x + width, 0);
        texture.addColorStop(0, 'rgba(0,0,0,0)');
        texture.addColorStop(.5, shade);
        texture.addColorStop(1, 'rgba(0,0,0,0)');
        b.fillStyle = texture;
        b.fillRect(x, wallTop, width, state.height - wallTop);
      }

      const topBeam = b.createLinearGradient(0, wallTop - 17, 0, wallTop + 18);
      topBeam.addColorStop(0, '#4a2719');
      topBeam.addColorStop(.18, '#180906');
      topBeam.addColorStop(.58, '#3a1c12');
      topBeam.addColorStop(1, '#0d0403');
      b.fillStyle = topBeam;
      b.fillRect(0, wallTop - 15, state.width, 30);
      b.fillStyle = 'rgba(230,145,81,.19)';
      b.fillRect(0, wallTop - 14, state.width, 1);

      const edgeWidth = Math.max(18, Math.min(34, state.width * .022));
      for (const x of [0, state.width - edgeWidth]) {
        const beam = b.createLinearGradient(x, 0, x + edgeWidth, 0);
        if (x === 0) {
          beam.addColorStop(0, '#080201');
          beam.addColorStop(.7, '#3a1b11');
          beam.addColorStop(1, '#130704');
        } else {
          beam.addColorStop(0, '#130704');
          beam.addColorStop(.3, '#3a1b11');
          beam.addColorStop(1, '#080201');
        }
        b.fillStyle = beam;
        b.fillRect(x, wallTop, edgeWidth, state.height - wallTop);
      }

      const vignette = b.createRadialGradient(state.width * .54, state.height * .48, state.width * .07, state.width * .54, state.height * .48, state.width * .72);
      vignette.addColorStop(0, 'rgba(255,164,102,.035)');
      vignette.addColorStop(.58, 'rgba(5,2,1,.10)');
      vignette.addColorStop(1, 'rgba(2,1,0,.76)');
      b.fillStyle = vignette;
      b.fillRect(0, 0, state.width, state.height);
    }

    function drawTavern(time) {
      ctx.clearRect(0, 0, state.width, state.height);
      if (!state.tavernSceneReady) {
        ctx.drawImage(backdropCanvas, 0, 0, state.width, state.height);
        return;
      }

      ctx.save();
      const roomWash = ctx.createLinearGradient(0, 0, 0, state.height);
      roomWash.addColorStop(0, 'rgba(7,2,1,.24)');
      roomWash.addColorStop(.22, 'rgba(28,10,4,.04)');
      roomWash.addColorStop(.68, 'rgba(12,4,2,.10)');
      roomWash.addColorStop(1, 'rgba(3,1,0,.38)');
      ctx.fillStyle = roomWash;
      ctx.fillRect(0, 0, state.width, state.height);

      const warmBloom = ctx.createRadialGradient(
        state.width * .32,
        state.height * .42,
        8,
        state.width * .32,
        state.height * .42,
        state.width * .52
      );
      const pulse = reduceMotion ? .055 : .055 + Math.sin(time * .8) * .009;
      warmBloom.addColorStop(0, `rgba(255,133,57,${pulse})`);
      warmBloom.addColorStop(.55, 'rgba(153,57,21,.018)');
      warmBloom.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = warmBloom;
      ctx.fillRect(0, 0, state.width, state.height);

      drawCabaretFrame();
      ctx.restore();
    }

    function drawCabaretFrame() {
      const L = layout();
      const beamTop = L.compact ? 91 : 118;
      const beamHeight = L.compact ? 14 : 19;
      const edge = Math.max(18, Math.min(34, state.width * .024));

      const topBeam = ctx.createLinearGradient(0, beamTop, 0, beamTop + beamHeight);
      topBeam.addColorStop(0, 'rgba(92,43,24,.93)');
      topBeam.addColorStop(.28, 'rgba(28,9,5,.94)');
      topBeam.addColorStop(.68, 'rgba(72,30,17,.92)');
      topBeam.addColorStop(1, 'rgba(13,4,2,.94)');
      ctx.fillStyle = topBeam;
      ctx.fillRect(0, beamTop, state.width, beamHeight);
      ctx.fillStyle = 'rgba(255,196,104,.42)';
      ctx.fillRect(0, beamTop, state.width, 1.5);
      ctx.fillStyle = 'rgba(115,54,28,.64)';
      ctx.fillRect(0, beamTop + beamHeight - 2, state.width, 2);

      for (const x of [0, state.width - edge]) {
        const side = ctx.createLinearGradient(x, 0, x + edge, 0);
        if (x === 0) {
          side.addColorStop(0, 'rgba(5,1,1,.98)');
          side.addColorStop(.66, 'rgba(76,30,16,.94)');
          side.addColorStop(1, 'rgba(17,5,3,.96)');
        } else {
          side.addColorStop(0, 'rgba(17,5,3,.96)');
          side.addColorStop(.34, 'rgba(76,30,16,.94)');
          side.addColorStop(1, 'rgba(5,1,1,.98)');
        }
        ctx.fillStyle = side;
        ctx.fillRect(x, beamTop, edge, state.height - beamTop);
        ctx.fillStyle = 'rgba(255,189,92,.35)';
        ctx.fillRect(x === 0 ? edge - 2 : x, beamTop, 2, state.height - beamTop);
      }

      const panelY = beamTop + beamHeight + 8;
      const panelBottom = Math.max(panelY + 24, L.laneY[0] - L.spriteHeight * .56);
      const panelWidth = Math.max(54, Math.min(112, state.width * .08));
      const panelInset = edge + 11;
      for (const x of [panelInset, state.width - panelInset - panelWidth]) {
        const panel = ctx.createLinearGradient(x, 0, x + panelWidth, 0);
        panel.addColorStop(0, 'rgba(27,8,5,.56)');
        panel.addColorStop(.5, 'rgba(102,47,24,.29)');
        panel.addColorStop(1, 'rgba(20,6,4,.58)');
        ctx.fillStyle = panel;
        ctx.strokeStyle = 'rgba(231,163,78,.28)';
        ctx.lineWidth = 1.5;
        roundedRect(x, panelY, panelWidth, panelBottom - panelY, 4);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,226,166,.12)';
        ctx.lineWidth = 1;
        roundedRect(x + 5, panelY + 5, panelWidth - 10, panelBottom - panelY - 10, 3);
        ctx.stroke();
      }
    }

    function drawSprite(image, x, baseY, size, options = {}) {
      if (!image) return;
      const bob = reduceMotion ? 0 : Math.sin(options.time || 0) * (options.bob ?? 2.2);
      ctx.save();
      ctx.translate(x, baseY + bob);
      if (options.rotation) ctx.rotate(options.rotation);
      ctx.scale((options.flip ? -1 : 1) * (options.scaleX || 1), options.scaleY || 1);
      if (options.glow) {
        ctx.shadowColor = options.glow;
        ctx.shadowBlur = Math.max(8, size * .12);
      }
      if (options.filter) ctx.filter = options.filter;
      ctx.globalAlpha = options.alpha ?? 1;
      ctx.drawImage(image, -size * .5, -size, size, size);
      ctx.restore();
    }

    function drawGroundShadow(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, .34);
      const shadow = ctx.createRadialGradient(0, 0, 2, 0, 0, size);
      shadow.addColorStop(0, 'rgba(0,0,0,.82)');
      shadow.addColorStop(.6, 'rgba(0,0,0,.42)');
      shadow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shadow;
      ctx.beginPath();
      ctx.arc(0, 0, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPlacemat(x, y, selected) {
      const width = Math.max(48, Math.min(70, layout().spriteHeight * .55));
      const depth = Math.max(12, width * .25);
      ctx.save();
      ctx.shadowColor = selected ? 'rgba(255,191,85,.72)' : 'rgba(0,0,0,.68)';
      ctx.shadowBlur = selected ? 12 : 7;
      ctx.beginPath();
      ctx.moveTo(x - width * .43, y - depth * .56);
      ctx.lineTo(x + width * .43, y - depth * .56);
      ctx.lineTo(x + width * .5, y + depth * .44);
      ctx.lineTo(x - width * .5, y + depth * .44);
      ctx.closePath();
      const cloth = ctx.createLinearGradient(0, y - depth, 0, y + depth);
      cloth.addColorStop(0, '#731f16');
      cloth.addColorStop(.52, '#4b130d');
      cloth.addColorStop(1, '#260806');
      ctx.fillStyle = cloth;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#efb75b';
      ctx.lineWidth = selected ? 2.5 : 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - width * .33, y - depth * .31);
      ctx.lineTo(x + width * .33, y - depth * .31);
      ctx.lineTo(x + width * .38, y + depth * .20);
      ctx.lineTo(x - width * .38, y + depth * .20);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,232,178,.58)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function woodCounterHeight(L) {
      return Math.max(L.compact ? 55 : 70, Math.min(L.compact ? 68 : 88, L.spriteHeight * .62));
    }

    function drawWoodCounter(L, lane) {
      const y = L.laneY[lane];
      const x = L.counterStart - 18;
      const width = L.counterEnd - L.counterStart + 36;
      const renderHeight = woodCounterHeight(L);

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.86)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;
      if (state.sprites.counter) {
        ctx.drawImage(state.sprites.counter, x - 4, y - 8, width + 8, renderHeight);
      } else {
        const fallback = ctx.createLinearGradient(0, y - 7, 0, y + renderHeight);
        fallback.addColorStop(0, '#32140b');
        fallback.addColorStop(.18, '#5a2d19');
        fallback.addColorStop(1, '#130503');
        ctx.fillStyle = fallback;
        ctx.fillRect(x, y - 7, width, renderHeight - 2);
      }
      ctx.restore();

      ctx.save();
      const polish = ctx.createLinearGradient(0, y - 7, 0, y + 10);
      polish.addColorStop(0, 'rgba(255,224,170,.46)');
      polish.addColorStop(.18, 'rgba(255,173,91,.2)');
      polish.addColorStop(1, 'rgba(65,20,8,0)');
      ctx.fillStyle = polish;
      ctx.fillRect(x + 3, y - 7, width - 6, 13);
      ctx.fillStyle = 'rgba(255,203,112,.5)';
      ctx.fillRect(x + 2, y - 7, width - 4, 1.5);
      ctx.fillStyle = 'rgba(23,5,2,.72)';
      ctx.fillRect(x + 6, y + renderHeight - 10, width - 12, 4);
      ctx.restore();
    }

    function drawVessel(x, y, returning, scale = 1, rotation = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);
      const bottle = state.sprites.sakeBottle;
      if (bottle) {
        const size = returning ? 39 : 44;
        ctx.shadowColor = 'rgba(0,0,0,.82)';
        ctx.shadowBlur = returning ? 5 : 7;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 5;
        ctx.globalAlpha = returning ? .78 : 1;
        ctx.filter = returning
          ? 'brightness(.58) saturate(.28) contrast(1.1)'
          : 'brightness(.88) contrast(1.08) saturate(.92)';
        ctx.drawImage(bottle, -size * .5, -size * .91, size, size);
      } else {
        ctx.shadowColor = returning ? '#72dcff' : '#ffe2a0';
        ctx.shadowBlur = 10;
        ctx.fillStyle = returning ? '#bceeff' : '#fff3d6';
        ctx.strokeStyle = '#78441e';
        ctx.lineWidth = 2;
        roundedRect(-10, -12, 20, 20, 5);
        ctx.fill();
        ctx.stroke();
        if (!returning) {
          ctx.fillStyle = '#f0ad50';
          ctx.fillRect(-7, -9, 14, 5);
        }
      }
      ctx.restore();
    }

    function drawCustomer(customer, time, L, groundY) {
      const customerHeight = L.spriteHeight * CUSTOMER_RENDER_HEIGHT_SCALE;
      drawGroundShadow(customer.x, groundY, customerHeight * .30);

      if (customer.drinking) {
        const progress = 1 - Math.max(0, customer.drinkTimer) / Math.max(.001, customer.drinkDuration);
        drawVessel(
          customer.x - customerHeight * .13,
          groundY - customerHeight * .60 + Math.sin(time * 4.6 + customer.bobSeed) * 2,
          false,
          Math.max(.56, Math.min(.74, customerHeight / 165)),
          -.42 + progress * .18
        );
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(15,7,4,.82)';
        ctx.beginPath();
        ctx.moveTo(customer.x - 20, groundY - customerHeight + 5);
        ctx.lineTo(customer.x + 20, groundY - customerHeight + 5);
        ctx.stroke();
        ctx.strokeStyle = '#ffc96a';
        ctx.beginPath();
        ctx.moveTo(customer.x - 20, groundY - customerHeight + 5);
        ctx.lineTo(customer.x - 20 + 40 * progress, groundY - customerHeight + 5);
        ctx.stroke();
        ctx.restore();
      }
      if (!customer.leaving && customer.drinksRemaining > 1) {
        ctx.fillStyle = '#130804';
        ctx.strokeStyle = '#ffc96a';
        ctx.lineWidth = 2;
        roundedRect(customer.x - 25, groundY - customerHeight + 4, 50, 23, 10);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff4df';
        ctx.font = '900 12px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${customer.drinksRemaining} DRINKS`, customer.x, groundY - customerHeight + 15);
      }
    }

    function drawGame(time) {
      const L = layout();
      drawTavern(time);
      const playerPosition = Math.max(0, Math.min(2, state.playerLanePosition));
      const playerLaneBefore = Math.floor(playerPosition);
      const playerLaneAfter = Math.ceil(playerPosition);
      const playerLaneMix = playerPosition - playerLaneBefore;
      const playerY = L.laneY[playerLaneBefore] + (L.laneY[playerLaneAfter] - L.laneY[playerLaneBefore]) * playerLaneMix;
      const playerDrawLane = Math.round(playerPosition);

      for (let lane = 0; lane < 3; lane++) {
        const y = L.laneY[lane];
        const selected = lane === state.targetLane;
        const customers = state.customers.filter(customer => customer.lane === lane);
        const serviceGroundY = y + Math.max(10, L.spriteHeight * .09);

        // Live 3D customers render behind this transparent foreground canvas,
        // so trays and wooden counters correctly cover their lower edge.
        customers.forEach(customer => drawCustomer(customer, time, L, serviceGroundY));

        if (lane === playerDrawLane) {
          const bartenderX = L.counterStart - L.spriteHeight * .31;
          const bartenderHeight = L.spriteHeight * .96;
          const bartenderBaseY = playerY + Math.max(42, L.spriteHeight * .35);
          const bartenderFrame = Math.floor(state.playerWalkTime * BARTENDER_WALK_FPS) % BARTENDER_WALK_FRAME_COUNT;
          const bartenderSprite = state.playerWalking && !reduceMotion
            ? state.sprites[`bartenderWalk${bartenderFrame}`] || state.sprites.bartender
            : state.sprites.bartender;
          drawGroundShadow(bartenderX, playerY + Math.max(26, L.spriteHeight * .22), L.spriteHeight * .25);
          drawSprite(bartenderSprite, bartenderX, bartenderBaseY, bartenderHeight, {
            flip: false,
            alpha: 1,
            time: state.playerWalking ? state.playerWalkTime * BARTENDER_WALK_FPS : time * 2.5 + lane,
            bob: state.playerWalking && !reduceMotion ? 1 : 2,
            rotation: state.playerWalking && !reduceMotion ? state.playerWalkDirection * .025 : 0
          });
        }

        drawWoodCounter(L, lane);
        drawPlacemat(L.serviceX, y + 1, selected);

        ctx.fillStyle = selected ? '#fff0c5' : '#ffc96a';
        ctx.font = `950 ${L.compact ? 12 : 15}px system-ui`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(lane + 1), L.counterStart - 6, y + 25);

      }

      for (const drink of state.drinks) drawVessel(drink.x, L.laneY[drink.lane] - 2, false);
      for (const empty of state.empties) drawVessel(empty.x, L.laneY[empty.lane] - 2, true);

      for (const particle of state.particles) {
        const alpha = Math.max(0, 1 - particle.age / particle.life);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x - 2, particle.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      if (state.paused) return;
      const dt = Math.min(.05, Math.max(0, (now - state.lastTime) / 1000));
      state.lastTime = now;
      update(dt);
      updateCustomerModels(dt);
      renderTavernFrame(now / 1000);
      drawGame(now / 1000);
      state.animationId = requestAnimationFrame(frame);
    }

    function resume() {
      if (!state.paused && state.animationId) return;
      state.paused = false;
      state.lastTime = performance.now();
      state.animationId = requestAnimationFrame(frame);
    }

    function suspend() {
      state.paused = true;
      cancelAnimationFrame(state.animationId);
      state.animationId = 0;
    }

    document.getElementById('move-up').addEventListener('click', () => moveLane(-1));
    document.getElementById('move-down').addEventListener('click', () => moveLane(1));
    document.getElementById('serve').addEventListener('click', serve);
    document.getElementById('maximize').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (error) { reportAnomaly('fullscreen', error); }
    });

    addEventListener('keydown', event => {
      if (event.repeat && event.code === 'Space') return;
      if (event.code === 'ArrowLeft' || event.code === 'ArrowUp' || event.code === 'KeyW') {
        event.preventDefault();
        moveLane(-1);
      } else if (event.code === 'ArrowRight' || event.code === 'ArrowDown' || event.code === 'KeyS') {
        event.preventDefault();
        moveLane(1);
      } else if (event.code === 'Space') {
        event.preventDefault();
        serve();
      }
    });

    addEventListener('resize', resize);
    addEventListener('pagehide', suspend);
    addEventListener('pageshow', resume);
    document.addEventListener('visibilitychange', () => document.hidden ? suspend() : resume());

    resize();
    updateHud();
    Promise.all(Object.entries(IMAGE_SOURCES).map(([name, url]) => loadSprite(name, url)))
      .then(async () => {
        const [roomResult, monsterResult] = await Promise.allSettled([
          loadTavernScene(),
          loadMonsterTemplates()
        ]);
        if (roomResult.status === 'rejected') {
          reportAnomaly('tavern-model-load', roomResult.reason, 'SAKE_TAP_SCENE');
          el.live.textContent = 'The 3D tavern room could not load. The safe painted tavern fallback remains available.';
        }
        if (monsterResult.status === 'rejected') {
          reportAnomaly('monster-model-load', monsterResult.reason, 'SAKE_TAP_ACTORS');
          el.live.textContent = 'The live 3D tavern customers could not load.';
        }
        seedPreview();
        resume();
        postParent({
          type: 'TAPPER_READY',
          renderer: 'canvas2d+live-three-room+animated-actors',
          runtimeGlbs: (state.tavernSceneReady ? 1 : 0) + (state.monsterModelsReady ? Object.keys(state.monsterTemplates).length : 0),
          roomModel: TAVERN_MODEL_URL,
          monsterModels: Object.values(MONSTER_MODEL_SPECS).map(spec => spec.url),
          roomShell: 'original-tapper-wood-floor+cropped-low-wallpanels',
          floorTextureSource: 'original-tapper-procedural-wood',
          wallTexture: CABARET_WALL_TEXTURE_URL,
          roomTriangles: state.tavernTriangles,
          monsterTriangles: state.monsterTriangles,
          monsterRootTiltTracksRemoved: Object.values(state.monsterTemplates).reduce((sum, template) => sum + template.rootTiltTracksRemoved, 0),
          threeDrawsPerFrame: state.tavernSceneReady ? 2 : 0,
          webglContextReleased: false,
          spriteCount: Object.keys(IMAGE_SOURCES).length,
          imageCount: Object.keys(state.sprites).length,
          playerWalkFrames: BARTENDER_WALK_FRAME_COUNT,
          playerWalkClip: 'NlaTrack.005',
          playerLaneTravelSeconds: +(1 / BARTENDER_LANES_PER_SECOND).toFixed(3),
          monsterAnimationFrames: 0,
          monsterModelStyle: 'live-current-dungeon-glbs',
          bottleModelSource: './assets/models/sake-bottle.glb',
          bottleRuntimeGlbs: 0,
          difficultyMode: 'endless-linear-levels',
          difficultyMultiplier: 'level-number',
          goldPerCompletedLevel: 5,
          wageCycleSeconds: WAGE_CYCLE_SECONDS,
          difficultyPerSecond: DIFFICULTY_PER_SECOND
        });
      })
      .catch(error => {
        reportAnomaly('sprite-load', error);
        showBanner('SPRITES COULD NOT LOAD', 'Check the Sake Tap sprite package', 0);
        resume();
      });
  })();
  </script>
</body>
</html>
